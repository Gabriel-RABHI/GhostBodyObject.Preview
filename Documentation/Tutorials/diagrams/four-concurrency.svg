<text x="760" y="322" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Befriend("Ada", "Bob")</text>
<text x="880" y="320" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M874 332L878.5 336.5L886 327.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="928" y="364" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">GetOrNew finds the friendship that T2 gave, and dates it</text>
