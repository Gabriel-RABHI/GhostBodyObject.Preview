<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>An edge is an aggregate of its own</title>
<desc>Two scenarios of two concurrent transactions, the second committing first. One changes the date of the friendship while the other renames Ada: two aggregates, both commit. Both give the friendship of Ada and Bob: the commit of the first conflicts. Its retry runs the same code: GetOrNew finds the friendship that the second gave, dates it, and commits. The pair has one friendship.</desc>
<rect width="960" height="382" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">An edge is an aggregate of its own</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two concurrent transactions, the first one committing last: the same pair conflicts, and retries</text>
<text x="32" y="130" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">An edge and its end</text>
<text x="32" y="150" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The friendship and Ada:</text>
<text x="32" y="166" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">two aggregates</text>
<text x="238" y="136" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T1</text>
