<text x="32" y="242" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The same pair</text>
<text x="32" y="262" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Both give the friendship</text>
