<circle cx="330" cy="132" r="4" fill="#aebcc4"/>
<text x="330" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">friendship.Since = ...</text>
<text x="660" y="120" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="238" y="180" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T2</text>
<line x1="250" y1="176" x2="552" y2="176" stroke="#4a5a62" stroke-width="1"/>
<circle cx="430" cy="176" r="4" fill="#aebcc4"/>
<text x="430" y="166" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Name = "Ada Lovelace"</text>
<text x="552" y="164" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
