<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>From the need to the declaration</title>
<desc>Two ladders of questions. What is this type? Created and removed with another entity: a part, a composition T, Option&lt;T&gt; or IEntityCollection&lt;T&gt;, and [Orphanable] to outlive its Owner. Kept only while something uses it: a shared object, designated by [Strong]. Removed by your business: [Root, Removable]. Otherwise [Root]. What is this link? It carries data: a part with a strong reference and its properties. The target must stay while the link designates it: [Strong]. Otherwise [Weak], always an Option or a collection.</desc>
<rect width="960" height="476" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">From the need to the declaration</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Ask the questions in their order: the first yes gives the declaration</text>
<text x="32" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">What is this type?</text>
<rect x="32" y="118" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="137" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Is it created and</text><text x="128" y="154" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">removed with another</text><text x="128" y="171" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">entity?</text>
<path d="M224 150L245 150" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 146.4L252 150L244.8 153.6Z" fill="#aebcc4"/>
<text x="238" y="143" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="118" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="358" y="137" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A part</text><text x="358" y="154" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">T, Option&lt;T&gt;</text><text x="358" y="171" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">IEntityCollection&lt;T&gt;</text>
<path d="M128 182L128 195" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M131.6 194.8L128 202L124.4 194.8Z" fill="#aebcc4"/>
<text x="136" y="196" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<rect x="32" y="202" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="229.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Is it kept only while</text><text x="128" y="246.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">something uses it?</text>
<path d="M224 234L245 234" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 230.4L252 234L244.8 237.6Z" fill="#aebcc4"/>
<text x="238" y="227" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="202" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="358" y="229.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A shared object</text><text x="358" y="246.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Strong] on its links</text>
<path d="M128 266L128 279" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M131.6 278.8L128 286L124.4 278.8Z" fill="#aebcc4"/>
<text x="136" y="280" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<rect x="32" y="286" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="313.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Does your business</text><text x="128" y="330.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">remove it?</text>
<path d="M224 318L245 318" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 314.4L252 318L244.8 321.6Z" fill="#aebcc4"/>
<text x="238" y="311" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="286" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="358" y="313.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A Root</text><text x="358" y="330.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Root, Removable]</text>
<path d="M128 350L128 363" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M131.6 362.8L128 370L124.4 362.8Z" fill="#aebcc4"/>
<text x="136" y="364" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<rect x="32" y="370" width="432" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="248" y="397.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Reference data</text><text x="248" y="414.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Root]</text>
<text x="496" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">What is this link?</text>
<rect x="496" y="118" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="592" y="145.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Does it carry data: a</text><text x="592" y="162.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">quantity, a date, a position?</text>
<path d="M688 150L709 150" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 146.4L716 150L708.8 153.6Z" fill="#aebcc4"/>
<text x="702" y="143" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="716" y="118" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="145.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A part of its own</text><text x="822" y="162.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Strong] T, and its values</text>
<path d="M592 182L592 195" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M595.6 194.8L592 202L588.4 194.8Z" fill="#aebcc4"/>
<text x="600" y="196" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<rect x="496" y="202" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="592" y="229.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Must the target stay while</text><text x="592" y="246.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">the link designates it?</text>
<path d="M688 234L709 234" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 230.4L716 234L708.8 237.6Z" fill="#aebcc4"/>
<text x="702" y="227" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="716" y="202" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="221" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A strong reference</text><text x="822" y="238" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Strong] T, [Strong] Option&lt;T&gt;</text><text x="822" y="255" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Strong] IEntityCollection&lt;T&gt;</text>
<path d="M592 266L592 279" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M595.6 278.8L592 286L588.4 278.8Z" fill="#aebcc4"/>
<text x="600" y="280" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<rect x="496" y="286" width="432" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="712" y="313.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A weak reference</text><text x="712" y="330.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Weak] Option&lt;T&gt;, [Weak] IEntityCollection&lt;T&gt;</text>
<text x="32" y="458" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A part that must survive its Owner while something retains it: [Orphanable], its [OwnedFrom] an Option&lt;T&gt;</text>
</svg>
