<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A change that no Record tells is lost at a rebuild</title>
<desc>Five steps. The first opening: one commit, by Parcels.Register and Parcels.Scan, leaves PX-11001 InTransit Lyon 1, and the Log holds registered PX-11001 and scanned at Lyon. The second opening finds the model ready; a transaction moves the parcel to Nowhere without a Record: the model says InTransit Nowhere 1, and the Log has not changed. The third opening calls RebuildFromLog(): the model is empty, behind its Log, which is kept. Replay.Run brings it back: PX-11001 InTransit Lyon 1. The fourth opening finds it ready, without a replay.</desc>
<rect width="960" height="366" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A change that no Record tells is lost at a rebuild</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A model on disk and its Log on disk: what each one holds, over four openings</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="116" cy="94" r="3.5" fill="#aebcc4"/><circle cx="298" cy="94" r="3.5" fill="#aebcc4"/><circle cx="480" cy="94" r="3.5" fill="#aebcc4"/><circle cx="662" cy="94" r="3.5" fill="#aebcc4"/><circle cx="844" cy="94" r="3.5" fill="#aebcc4"/>
<text x="32" y="160" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">The parcel, on disk</text>
<text x="32" y="270" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">The Log, on disk</text>
<text x="116" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the first opening</text>
<text x="116" y="134" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Register, Scan</text>
<rect x="32" y="170" width="168" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="116" y="197.5" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">PX-11001</text><text x="116" y="214.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">InTransit Lyon 1</text>
<rect x="32" y="280" width="168" height="58" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="116" y="304.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">registered PX-11001</text><text x="116" y="321.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">scanned at Lyon</text>
<text x="298" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the second opening</text>
<text x="298" y="134" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">.Depot = "Nowhere"</text>
<rect x="214" y="170" width="168" height="64" rx="8" fill="#47292d" stroke="#f07a78" stroke-width="1.5"/><text x="298" y="197.5" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">PX-11001</text><text x="298" y="214.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">InTransit Nowhere 1</text>
<text x="298" y="254" font-size="12" font-weight="600" fill="#f07a78" text-anchor="middle">no Record tells it</text>
<rect x="214" y="280" width="168" height="58" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="298" y="304.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">registered PX-11001</text><text x="298" y="321.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">scanned at Lyon</text>
<text x="480" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the third opening</text>
<text x="480" y="134" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">RebuildFromLog()</text>
<rect x="396" y="170" width="168" height="64" rx="8" fill="#46391f" stroke="#e4a93c" stroke-width="1.5"/><text x="480" y="197.5" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Empty</text><text x="480" y="214.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">IsBehindLog</text>
<rect x="396" y="280" width="168" height="58" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="480" y="304.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">registered PX-11001</text><text x="480" y="321.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">scanned at Lyon</text>
<text x="662" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Replay.Run(...)</text>
<text x="662" y="134" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<rect x="578" y="170" width="168" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="662" y="197.5" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">PX-11001</text><text x="662" y="214.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">InTransit Lyon 1</text>
<text x="662" y="254" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">where its Records say</text>
<rect x="578" y="280" width="168" height="58" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="662" y="304.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">registered PX-11001</text><text x="662" y="321.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">scanned at Lyon</text>
<text x="844" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the fourth opening</text>
<text x="844" y="134" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<rect x="760" y="170" width="168" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="844" y="197.5" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">PX-11001</text><text x="844" y="214.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">InTransit Lyon 1</text>
<text x="844" y="254" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">ready, without a replay</text>
<rect x="760" y="280" width="168" height="58" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="844" y="304.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">registered PX-11001</text><text x="844" y="321.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">scanned at Lyon</text>
</svg>
