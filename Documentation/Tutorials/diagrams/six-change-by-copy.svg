<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>To change one field, change a copy, then assign it</title>
<desc>Four instructions. The guest Ada holds the address 12 rue de Rivoli, Paris. ada.Home.ToBody() copies it out into home. home.Street changes the copy to 14 rue de Rivoli, and the guest still reads 12 rue de Rivoli. ada.Home = home copies the value back: the guest reads 14 rue de Rivoli, Paris.</desc>
<rect width="960" height="366" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">To change one field, change a copy, then assign it</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The Home of the guest and your copy, at each instruction</text>
<text x="434" y="110" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Home</text>
<text x="434" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">in the guest</text>
<text x="800" y="110" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">home</text>
<text x="800" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">your copy</text>
<text x="32" y="162" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">var ada = new Guest { ... }</text>
<rect x="306" y="140" width="256" height="36" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="434" y="162.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">12 rue de Rivoli, Paris</text>
<line x1="32" y1="184" x2="928" y2="184" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="214" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">var home = ada.Home.ToBody()</text>
<rect x="306" y="192" width="256" height="36" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="434" y="214.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">12 rue de Rivoli, Paris</text>
<rect x="672" y="192" width="256" height="36" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="800" y="214.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">12 rue de Rivoli, Paris</text>
<path d="M562 210L665 210" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M664.8 206.4L672 210L664.8 213.6Z" fill="#aebcc4"/>
<text x="617" y="202" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">copied out</text>
<line x1="32" y1="236" x2="928" y2="236" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="266" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">home.Street = "14 rue de Rivoli"</text>
<rect x="306" y="244" width="256" height="36" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="434" y="266.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">12 rue de Rivoli, Paris</text>
<rect x="672" y="244" width="256" height="36" rx="4" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/>
<text x="800" y="266.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">14 rue de Rivoli, Paris</text>
<line x1="32" y1="288" x2="928" y2="288" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="318" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Home = home</text>
<rect x="306" y="296" width="256" height="36" rx="4" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/>
<text x="434" y="318.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">14 rue de Rivoli, Paris</text>
<rect x="672" y="296" width="256" height="36" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="800" y="318.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">14 rue de Rivoli, Paris</text>
<path d="M672 314L569 314" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M569.2 317.6L562 314L569.2 310.4Z" fill="#3987e5"/>
<text x="617" y="306" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">copied back</text>
</svg>
