<path d="M684 208L772 208Q780 208 780 200L780 160" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M776.4 167.2L780 160L783.6 167.2" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M774 144L786 156M786 144L774 156" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="794" y="154" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
