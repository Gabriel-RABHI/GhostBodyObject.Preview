<line x1="372" y1="358" x2="672" y2="358" stroke="#4a5a62" stroke-width="1"/>
<circle cx="560" cy="358" r="4" fill="#aebcc4"/>
<text x="560" y="348" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Change("Coffee", 500)</text>
<text x="672" y="346" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
