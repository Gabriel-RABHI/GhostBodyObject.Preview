<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The host is the unit of conflict of its Records</title>
<desc>One bill of Ada, two lines, Wine at 3,000 and Coffee at 400, written twice. As Records, the two lines live in one entity: a first transaction changes line 0, a second one changes line 1 and commits, and the commit of the first one conflicts. As parts, each line is an entity: the same two changes both commit.</desc>
<rect width="960" height="408" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The host is the unit of conflict of its Records</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two concurrent transactions change two different lines: the later commit conflicts when they changed one entity</text>
<text x="32" y="118" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Its lines as Records</text>
<text x="32" y="137" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">RecordBag&lt;RBillLine&gt; Lines</text>
<rect x="32" y="148" width="300" height="80" rx="10" fill="none" stroke="#f07a78" stroke-width="1.5"/><text x="44" y="168" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The bill of Ada</text><text x="320" y="168" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="end">one entity</text>
<rect x="44" y="184" width="132" height="32" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="54" y="204.3" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Wine</text>
<text x="166" y="204.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">3_000</text>
<rect x="188" y="184" width="132" height="32" rx="4" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
<text x="198" y="204.3" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Coffee</text>
<text x="310" y="204.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">400</text>
<text x="360" y="154" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T1</text>
<line x1="372" y1="150" x2="780" y2="150" stroke="#4a5a62" stroke-width="1"/>
<circle cx="440" cy="150" r="4" fill="#aebcc4"/>
<text x="440" y="140" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Change(0, 2_500)</text>
<text x="780" y="138" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="360" y="212" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T2</text>
<line x1="372" y1="208" x2="672" y2="208" stroke="#4a5a62" stroke-width="1"/>
