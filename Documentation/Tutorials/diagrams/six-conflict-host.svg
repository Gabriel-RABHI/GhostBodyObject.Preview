<text x="166" y="354.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">3_000</text>
<rect x="188" y="334" width="132" height="32" rx="4" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/>
<text x="198" y="354.3" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Coffee</text>
<text x="310" y="354.3" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">400</text>
<text x="360" y="304" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T1</text>
