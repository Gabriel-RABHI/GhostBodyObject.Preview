<svg xmlns="http://www.w3.org/2000/svg" width="960" height="394" viewBox="0 0 960 394" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A folder moves anywhere, except into its own subtree</title>
<desc>Two trees of the library of Ada. On the left, music.MoveTo(bebop.Folders) is refused: Bebop is a subfolder of Music, and the move would make a cycle. On the right, music.MoveTo(archive.Folders) moves Music, Jazz, Bebop and the playlist under Archive: the Owner of Music, a listener before, is now a folder.</desc>
<rect width="960" height="394" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A folder moves anywhere, except into its own subtree</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">MoveTo changes the Owner of a whole subtree, or refuses before anything changes</text>
<text x="32" y="108" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">music.MoveTo(bebop.Folders)</text>
<text x="500" y="108" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">music.MoveTo(archive.Folders)</text>
