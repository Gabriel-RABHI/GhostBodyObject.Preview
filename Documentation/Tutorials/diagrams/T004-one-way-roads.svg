<rect x="543" y="156" width="76" height="72" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="581" y="196.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Lyon</text>
