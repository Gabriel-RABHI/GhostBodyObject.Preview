<rect x="746" y="162" width="86" height="24" rx="8" fill="#46391f" stroke="#e4a93c" stroke-width="1.5"/><text x="789" y="178.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">465 km</text>
<path d="M726 210L746 210" fill="none" stroke="#3987e5" stroke-width="1.6"/>
<path d="M832 210L845 210" fill="none" stroke="#3987e5" stroke-width="1.6"/><path d="M844.8 206.4L852 210L844.8 213.6Z" fill="#3987e5"/>
<rect x="746" y="198" width="86" height="24" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="789" y="214.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">490 km</text>
<text x="650" y="258" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.RoadEdges.To(lyon).Count()</text>
<text x="928" y="258" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">2</text>
<text x="650" y="280" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">To(lyon).Min(r =&gt; r.Distance)</text>
