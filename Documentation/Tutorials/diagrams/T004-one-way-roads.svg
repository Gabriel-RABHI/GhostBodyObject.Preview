<text x="341" y="258" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.RoadEdges.Targets</text>
<text x="619" y="258" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">Lyon</text>
<text x="341" y="280" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.IncomingRoadEdges.Sources</text>
<text x="619" y="280" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">Lyon</text>
<text x="341" y="302" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">RoadCollection.Count()</text>
<text x="619" y="302" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">2</text>
<text x="650" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Two roads, one pair</text>
<text x="650" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.NewRoad(lyon, 490)</text>
