<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A road goes one way: a way back is another road</title>
<desc>Three maps of Paris and Lyon. One road of 465 km from Paris to Lyon: paris.RoadEdges.Targets gives Lyon, lyon.IncomingRoadEdges.Sources gives Paris, and neither city has a road the other way. A way back: a second road from Lyon to Paris; paris.RoadEdges.Targets and paris.IncomingRoadEdges.Sources both give Lyon, and the map has 2 roads. Two roads from Paris to Lyon, 465 km with a toll and 490 km free: paris.RoadEdges.To(lyon) holds 2 roads, and Lyon is one target.</desc>
<rect width="960" height="372" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A road goes one way: a way back is another road</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Each road is an edge of its own, from its From to its To, and two cities may have several</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">One road</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.NewRoad(lyon, 465)</text>
<line x1="32" y1="140" x2="310" y2="140" stroke="#2b3a42" stroke-width="1"/>
<rect x="32" y="156" width="76" height="72" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="70" y="196.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Paris</text>
<rect x="234" y="156" width="76" height="72" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="272" y="196.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Lyon</text>
<path d="M108 192L128 192" fill="none" stroke="#aebcc4" stroke-width="1.6"/>
<path d="M214 192L227 192" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M226.8 188.4L234 192L226.8 195.6Z" fill="#aebcc4"/>
<rect x="128" y="180" width="86" height="24" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="171" y="196.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">465 km</text>
<text x="32" y="258" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.RoadEdges.Targets</text>
<text x="310" y="258" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">Lyon</text>
<text x="32" y="280" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">lyon.IncomingRoadEdges.Sources</text>
<text x="310" y="280" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">Paris</text>
<text x="32" y="302" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">lyon.RoadEdges.Count()</text>
<text x="310" y="302" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">0</text>
<text x="32" y="324" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.IncomingRoadEdges.Count()</text>
<text x="310" y="324" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">0</text>
<text x="341" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A way back</text>
<text x="341" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">lyon.NewRoad(paris, 465)</text>
