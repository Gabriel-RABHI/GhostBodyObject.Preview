<text x="465" y="333.5" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="start">none</text>
<text x="480" y="392" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">The link becomes none</text>
<text x="480" y="412" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ON DELETE SET NULL</text>
