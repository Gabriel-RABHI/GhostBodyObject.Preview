<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Three links, three answers when the target goes</title>
<desc>Three columns. A strong reference from the album Low to its artist Bowie: the removal of Bowie is refused and nothing changes, as ON DELETE RESTRICT. A weak reference from Heroes to its previous album Low: Low is removed and the link becomes none, as ON DELETE SET NULL. A composition, Bowie holding the albums Low and Heroes: the removal of the Owner removes its parts, as ON DELETE CASCADE.</desc>
