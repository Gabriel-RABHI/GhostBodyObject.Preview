<text x="171" y="252" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">bowie.Remove()</text>
<path d="M171 260L171 275" fill="none" stroke="#4a5a62" stroke-width="1.2"/><path d="M174.6 274.8L171 282L167.4 274.8Z" fill="#4a5a62"/>
