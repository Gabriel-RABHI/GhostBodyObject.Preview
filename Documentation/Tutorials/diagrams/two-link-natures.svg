<text x="171" y="321" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Artist</text>
<text x="171" y="392" font-size="13" font-weight="600" fill="#f07a78" text-anchor="middle">Refused: nothing changes</text>
