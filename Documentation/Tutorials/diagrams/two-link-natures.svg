<rect x="796" y="186" width="120" height="32" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="856" y="206.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Heroes</text>
<text x="789" y="252" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">bowie.Remove()</text>
