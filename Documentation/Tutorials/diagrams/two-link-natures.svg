<rect x="796" y="324" width="120" height="32" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="856" y="344.7" font-size="13" font-weight="600" fill="#7f9199" text-anchor="middle">Heroes</text>
<text x="789" y="392" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Its parts go with it</text>
