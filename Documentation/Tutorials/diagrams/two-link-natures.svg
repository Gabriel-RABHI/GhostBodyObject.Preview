<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Three links, three answers when the target goes</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">One removal, and what the nature of the link makes of it</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A strong reference</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Strong] MArtist Artist</text>
