<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Search with Views, change with Bodies</title>
<desc>Three books, Dune at 9.90, Foundation at 8.50 and Neuromancer at 10.90. BookViewCollection.Where finds, with one View of each book, those below 10. ToBody() turns the two found into Bodies, which the transaction keeps; Price += 1m brings them to 10.90 and 9.50. Neuromancer gets no Body. transaction.Commit() writes the two changes: the Store holds 10.90, 9.50 and 10.90.</desc>
<rect width="960" height="408" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Search with Views, change with Bodies</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Three books read, two kept: only those found become objects of the transaction</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The Views find those below 10</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">BookViewCollection.Where(10m, ...)</text>
<text x="360" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Only those become Bodies</text>
<text x="360" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">cheap.ToBody().Price += 1m</text>
<text x="738" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The Store, after the commit</text>
<text x="738" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction.Commit()</text>
<rect x="360" y="150" width="238" height="160" rx="10" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="372" y="170" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Kept by the transaction</text>
<rect x="32" y="188" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="127" y="208" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text><text x="127" y="224" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">9.90</text>
<rect x="372" y="188" width="214" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="479" y="208" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text><text x="479" y="224" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">Price: 10.90</text>
<path d="M222 211L365 211" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M364.8 207.4L372 211L364.8 214.6Z" fill="#3987e5"/>
<path d="M586 211L731 211" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M730.8 207.4L738 211L730.8 214.6Z" fill="#aebcc4"/>
<rect x="738" y="188" width="190" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="833" y="208" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text><text x="833" y="224" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">10.90</text>
<rect x="32" y="252" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="127" y="272" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Foundation</text><text x="127" y="288" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">8.50</text>
<rect x="372" y="252" width="214" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="479" y="272" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Foundation</text><text x="479" y="288" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">Price: 9.50</text>
<path d="M222 275L365 275" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M364.8 271.4L372 275L364.8 278.6Z" fill="#3987e5"/>
<path d="M586 275L731 275" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M730.8 271.4L738 275L730.8 278.6Z" fill="#aebcc4"/>
<rect x="738" y="252" width="190" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="833" y="272" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Foundation</text><text x="833" y="288" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">9.50</text>
<rect x="32" y="316" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="127" y="336" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Neuromancer</text><text x="127" y="352" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">10.90</text>
<text x="479" y="343" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">Not found: no Body</text>
<rect x="738" y="316" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="833" y="336" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Neuromancer</text><text x="833" y="352" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">10.90</text>
<text x="32" y="390" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A View is a read-only struct: the transaction keeps nothing of it. A Body is an object: the transaction keeps each one it gives</text>
</svg>
