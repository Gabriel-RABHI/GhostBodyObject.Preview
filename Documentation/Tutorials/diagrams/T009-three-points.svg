<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A merge has three points: the epoch, the head and the new value</title>
<desc>The value at the opening of the transaction, the epoch, is 10 tickets. Another till commits 13, the head. This transaction writes 12, its new value. Its commit writes the head plus the new value minus the epoch, 13 plus 12 minus 10, 15 tickets: both sales are counted, without a conflict.</desc>
<rect width="960" height="268" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A merge has three points: the epoch, the head and the new value</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two tills sell at the same time, on a [Delta]. The commit adds what the transaction changed to the last commit</text>
<rect x="32" y="170" width="96" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="80" y="191" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">10</text><text x="80" y="207" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">the epoch</text>
<path d="M128 188L375.2 121.8" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M374.2 118.4L382 120L376 125.3Z" fill="#aebcc4"/>
<path d="M128 200L375 219.5" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M375.1 215.9L382 220L374.6 223Z" fill="#aebcc4"/>
<text x="220" y="120" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">another till, +3</text>
<text x="220" y="240" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">this transaction, +2</text>
<rect x="382" y="96" width="96" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="430" y="117" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">13</text><text x="430" y="133" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">the head</text>
<rect x="382" y="196" width="96" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="430" y="217" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">12</text><text x="430" y="233" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">new</text>
<path d="M478 120L761.2 186.4" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M761.8 182.9L768 188L760.2 189.8Z" fill="#aebcc4"/>
<path d="M478 220L761 200.5" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M760.6 197L768 200L761.1 204Z" fill="#aebcc4"/>
<rect x="768" y="170" width="160" height="48" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="848" y="191" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">15</text><text x="848" y="207" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">committed</text>
<text x="848" y="242" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">13 + (12 - 10)</text>
</svg>
