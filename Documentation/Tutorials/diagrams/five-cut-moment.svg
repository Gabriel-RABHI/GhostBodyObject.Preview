<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Immediate cuts the words at each write, Commit once</title>
<desc>The same instructions in two rows: six writes of the description, the search of ethiopia, then the commit. With TextIndexing.Immediate, the default, each of the six writes cuts the words: 6 cuts. With TextIndexing.Commit, no write cuts them; the first search cuts them once, and sees the last text: 1 cut. Without a search, the cut falls at the commit. Both modes give the same results.</desc>
<rect width="960" height="300" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Immediate cuts the words at each write, Commit once</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The six writes of the description of the Tasting Box, then a search and the commit</text>
