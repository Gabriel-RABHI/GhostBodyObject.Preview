<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The write token goes to the replica that commits</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two writers of one Store, along the time: a commit takes the token once its replica holds every commit before</text>
<text x="32" y="148" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The office</text>
<text x="32" y="165" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">ReadWrite</text>
