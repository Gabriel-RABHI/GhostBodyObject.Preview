<svg xmlns="http://www.w3.org/2000/svg" width="960" height="398" viewBox="0 0 960 398" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The write token goes to the replica that commits</title>
<desc>Along the time, the office commits the parcel PX-5001 of Ada and holds the write token. The depot, a second writer, receives that commit; its commit of the status and of the depot Lyon takes the token. The office waits for that commit by CaughtUp, and its commit of the recipient Ada Lovelace takes the token back. Both replicas hold the three commits, in the same order, and TokenGeneration is at least generation + 2.</desc>
