<svg xmlns="http://www.w3.org/2000/svg" width="960" height="322" viewBox="0 0 960 322" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Each transaction comes framed: its start, its Records, its end</title>
<desc>Two commits: a round of Lyon with the scans PX-7001 and PX-7002, and a round of Paris with the scan PX-7003. The subscription calls OnTransactionStart, which empties the round; the handler of each scan, which counts it, to Lyon and 1, then Lyon and 2; OnTransactionEnd, which closes the round as first, Lyon, 2. Then the same for the next transaction: first + 1, Paris, 1. OnReplayEnd comes last, and rounds.Last is first + 1.</desc>
<rect width="960" height="322" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Each transaction comes framed: its start, its Records, its end</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The calls of one subscription, in their order, and the rounds that they build</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="92" cy="94" r="3.5" fill="#aebcc4"/><circle cx="194" cy="94" r="3.5" fill="#aebcc4"/><circle cx="296" cy="94" r="3.5" fill="#aebcc4"/><circle cx="398" cy="94" r="3.5" fill="#aebcc4"/><circle cx="530" cy="94" r="3.5" fill="#aebcc4"/><circle cx="632" cy="94" r="3.5" fill="#aebcc4"/><circle cx="734" cy="94" r="3.5" fill="#aebcc4"/><circle cx="867" cy="94" r="3.5" fill="#aebcc4"/>
<rect x="32" y="106" width="426" height="176" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="126" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The round of Lyon</text><text x="446" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">transaction first</text>
<rect x="44" y="138" width="96" height="50" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="92" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OnTransaction</text><text x="92" y="175.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Start</text>
<text x="92" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">("", 0)</text>
<rect x="146" y="138" width="96" height="50" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="194" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Handle</text><text x="194" y="175.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-7001</text>
<text x="194" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">("Lyon", 1)</text>
<rect x="248" y="138" width="96" height="50" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="296" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Handle</text><text x="296" y="175.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-7002</text>
<text x="296" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">("Lyon", 2)</text>
<rect x="350" y="138" width="96" height="50" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="398" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OnTransaction</text><text x="398" y="175.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">End</text>
<text x="398" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<path d="M398 188L398 223" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M401.6 222.8L398 230L394.4 222.8Z" fill="#aebcc4"/>
<rect x="264" y="230" width="182" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="355" y="254" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">(first, "Lyon", 2)</text>
<text x="256" y="255" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">Closed</text>
<rect x="470" y="106" width="324" height="176" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="482" y="126" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The round of Paris</text><text x="782" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">transaction first + 1</text>
<rect x="482" y="138" width="96" height="50" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="530" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OnTransaction</text><text x="530" y="175.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Start</text>
<text x="530" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">("", 0)</text>
<rect x="584" y="138" width="96" height="50" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="632" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Handle</text><text x="632" y="175.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-7003</text>
<text x="632" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">("Paris", 1)</text>
<rect x="686" y="138" width="96" height="50" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="734" y="158.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OnTransaction</text><text x="734" y="175.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">End</text>
<text x="734" y="208" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace"></text>
<path d="M734 188L734 223" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M737.6 222.8L734 230L730.4 222.8Z" fill="#aebcc4"/>
<rect x="600" y="230" width="182" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="691" y="254" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">(first + 1, "Paris", 1)</text>
<text x="592" y="255" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">Closed</text>
<rect x="806" y="138" width="122" height="50" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="867" y="167" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OnReplayEnd</text>
<path d="M867 188L867 223" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M870.6 222.8L867 230L863.4 222.8Z" fill="#aebcc4"/>
<rect x="806" y="230" width="122" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="867" y="254" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Last = first + 1</text>
<text x="32" y="304" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">In parentheses: the depot and the scans of the round. first: the number of the first transaction closed</text>
