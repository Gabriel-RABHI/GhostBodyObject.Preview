<svg xmlns="http://www.w3.org/2000/svg" width="960" height="306" viewBox="0 0 960 306" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The order of the Log is the order of the Add</title>
<desc>A scanner creates two Records on a thread of its own, without any transaction: lyon first, then paris, whose depot it corrects from Pari to Paris. The transaction takes paris first, by paris.Add(), then lyon, by lyon.Add(): ParcelCollection gives paris, then lyon. The commit appends them in that order: the Log holds Paris, then Lyon.</desc>
<rect width="960" height="306" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The order of the Log is the order of the Add</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two Records created on a thread of their own, then added in the other order</text>
<rect x="32" y="100" width="292" height="170" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A thread of its own</text><text x="312" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">no transaction: detached</text>
<rect x="396" y="100" width="218" height="170" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="408" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The transaction</text><text x="602" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">ParcelCollection</text>
<rect x="706" y="100" width="222" height="170" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="718" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The Log</text>
<rect x="44" y="134" width="268" height="54" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="178" y="165" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new ParcelScanned { Depot = "Lyon" }</text>
<rect x="44" y="200" width="268" height="54" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="178" y="222.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new ParcelScanned { Depot = "Pari" }</text><text x="178" y="239.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.Depot = "Paris"</text>
<path d="M312 161L402.2 223" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M404.1 220L408 227L400.1 225.9Z" fill="#aebcc4"/>
<path d="M312 227L402.2 165" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M400.1 162.1L408 161L404.1 168Z" fill="#aebcc4"/>
<rect x="408" y="134" width="194" height="54" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="505" y="158" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris.Add()</text><text x="505" y="174" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Paris, first</text>
<rect x="408" y="200" width="194" height="54" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="505" y="224" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">lyon.Add()</text><text x="505" y="240" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Lyon, second</text>
<path d="M602 161L711 161" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M710.8 157.4L718 161L710.8 164.6Z" fill="#aebcc4"/>
<path d="M602 227L711 227" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M710.8 223.4L718 227L710.8 230.6Z" fill="#aebcc4"/>
<text x="660" y="198" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<rect x="718" y="134" width="198" height="54" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="817" y="165.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Paris</text>
<rect x="718" y="200" width="198" height="54" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="817" y="231.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Lyon</text>
</svg>
