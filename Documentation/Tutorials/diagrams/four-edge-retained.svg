<text x="480" y="272" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">Nothing retains them now</text>
<text x="789" y="272" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">The club goes, with the membership</text>
<text x="650" y="294" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">MembershipCollection.Count()</text>
