<text x="74" y="336" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">an edge</text>
<path d="M136.6 332L155.6 332" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M155.4 328.4L162.6 332L155.4 335.6Z" fill="#aebcc4"/><text x="170.6" y="336" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">strong reference</text>
<text x="928" y="336" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">The exception of club.Remove() names the edge</text>
