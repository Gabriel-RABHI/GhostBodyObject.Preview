<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A strong reference to an edge retains it, and its two ends</title>
<desc>Three stages. A certificate designates the membership of Ada in the chess club by a strong reference: membership.Remove(), club.Remove() and ada.Remove() are each refused, and the exception of the club names the edge. After certificate.Remove(), nothing retains them. club.Remove() then removes the club, with the membership; Ada stays, and MembershipCollection.Count() is 0.</desc>
<rect width="960" height="352" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A strong reference to an edge retains it, and its two ends</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A certificate of membership keeps the membership, Ada and the chess club, until it is revoked</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="171" cy="94" r="3.5" fill="#aebcc4"/><circle cx="480" cy="94" r="3.5" fill="#aebcc4"/><circle cx="789" cy="94" r="3.5" fill="#aebcc4"/>
