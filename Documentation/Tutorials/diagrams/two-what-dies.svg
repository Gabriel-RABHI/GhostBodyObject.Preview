<svg xmlns="http://www.w3.org/2000/svg" width="960" height="574" viewBox="0 0 960 574" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>What dies, and when</title>
<desc>A chart of the lifetimes of the catalog of Lesson 20, over four instructions. bowie.Remove() is refused. Out of the lineup, Bowie is removed, with Lodger and its track. Low becomes an orphan. The entry removed, Low and its tracks die. eno.Remove() removes Brian Eno, its album, its track and the lyrics. The genre, the playlist, the listener and the festival stay.</desc>
