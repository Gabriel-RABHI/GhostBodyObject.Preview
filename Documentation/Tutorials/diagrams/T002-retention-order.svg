<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Take the new retention before releasing the old one</title>
<desc>Two rows. Retain, then release: final.Lyrics.Set(lyrics) brings the count to 2, demo.Lyrics.Clear() brings it back to 1, and the lyrics live, now held by final. Release, then retain: demo.Lyrics.Clear() brings the count to 0 and removes the lyrics; final.Lyrics.Set(lyrics) is then refused, as nothing is left to designate.</desc>
<rect width="960" height="372" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Take the new retention before releasing the old one</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The same two instructions, and the strong references to the lyrics at each one</text>
<text x="32" y="140" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Retain, then release</text>
<text x="32" y="160" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The lyrics pass from</text>
<text x="32" y="176" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">one holder to the other</text>
<text x="314" y="108" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the start</text>
<rect x="196" y="120" width="72" height="30" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="232" y="139.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">demo</text>
