<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Run delivers what is there, then a thread follows the new commits</title>
<desc>The Log holds a scan of PX-6001 at Lyon. Run delivers it on the calling thread, the board shows PX-6001 at Lyon, OnReplayEnd gives the number of the last transaction, and Run returns. The subscription then delivers each new commit on a thread of its own: PX-6001 at Paris, PX-6002 at Lille, then PX-6002 delivered, which leaves PX-6001 at Paris. end.Cancel() ends the subscription, its Completion cancelled: the scan at Nice reaches it no more, and the board stays at Paris.</desc>
<rect width="960" height="302" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Run delivers what is there, then a thread follows the new commits</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Each commit of the Log, and the board after its delivery</text>
<rect x="32" y="100" width="252" height="164" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The replay, in Run()</text><text x="272" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">the calling thread</text>
<rect x="295" y="100" width="370" height="164" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="307" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Each new commit</text><text x="653" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">on a thread of its own, at once</text>
<rect x="676" y="100" width="252" height="164" rx="10" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="688" y="120" font-size="13" font-weight="600" fill="#7f9199" text-anchor="start">The token cancelled</text><text x="916" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">the subscription ends</text>
<rect x="44" y="136" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="99" y="156" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="99" y="172" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-6001, Lyon</text>
<path d="M99 182L99 199" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M102.6 198.8L99 206L95.4 198.8Z" fill="#aebcc4"/>
<rect x="44" y="206" width="110" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="99" y="233" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">PX-6001 at Lyon</text>
<rect x="162" y="136" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="217" y="154.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OnReplayEnd</text><text x="217" y="171.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">the end of the replay</text>
<path d="M217 182L217 199" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M220.6 198.8L217 206L213.4 198.8Z" fill="#aebcc4"/>
<rect x="162" y="206" width="110" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="217" y="233" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ReadyAt &gt; 0</text>
<rect x="307" y="136" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="362" y="156" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="362" y="172" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-6001, Paris</text>
<path d="M362 182L362 199" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M365.6 198.8L362 206L358.4 198.8Z" fill="#aebcc4"/>
<rect x="307" y="206" width="110" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="362" y="233" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">PX-6001 at Paris</text>
<rect x="425" y="136" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="480" y="156" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="480" y="172" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-6002, Lille</text>
<path d="M480 182L480 199" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M483.6 198.8L480 206L476.4 198.8Z" fill="#aebcc4"/>
<rect x="425" y="206" width="110" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="480" y="224.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">PX-6001 at Paris</text><text x="480" y="241.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">PX-6002 at Lille</text>
<rect x="543" y="136" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="598" y="156" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelDelivered</text><text x="598" y="172" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-6002</text>
<path d="M598 182L598 199" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M601.6 198.8L598 206L594.4 198.8Z" fill="#aebcc4"/>
<rect x="543" y="206" width="110" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="598" y="233" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">PX-6001 at Paris</text>
<rect x="688" y="136" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="743" y="163" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">end.Cancel()</text>
<rect x="688" y="206" width="110" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="743" y="224.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Completion</text><text x="743" y="241.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">.IsCanceled</text>
<path d="M743 182L743 199" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M746.6 198.8L743 206L739.4 198.8Z" fill="#aebcc4"/>
<rect x="806" y="136" width="110" height="46" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="861" y="156" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">ParcelScanned</text><text x="861" y="172" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-6001, Nice</text>
<rect x="806" y="206" width="110" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="861" y="233" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">PX-6001 at Paris</text>
<text x="861" y="198" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">not delivered</text>
<text x="32" y="284" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">The handlers are never called together: the replay and each delivery after it, one at a time</text>
</svg>
