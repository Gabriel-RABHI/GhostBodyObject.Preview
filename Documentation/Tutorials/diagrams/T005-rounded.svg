<svg xmlns="http://www.w3.org/2000/svg" width="960" height="332" viewBox="0 0 960 332" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A rounded index stays exact: only a euro split by a bound is compared</title>
<desc>Nine totals in seven euros: 9.99 in the euro 9; 10.00 and 10.50 in the euro 10; 19.50 and 19.99 in the euro 19; 20.00, 25.50, 49.99 and 50.00 each in its own. From(19.99m) leaves the euros 9 and 10 whole, compares the euro 19, keeping 19.99 and leaving 19.50, and takes the following euros whole. Between(10.50m, 20m) leaves the euro 9, compares the euro 10, keeping 10.50 and leaving 10.00, takes the euro 19 whole, and leaves the euro 20 whole, without comparing anything: 20 is at the start of its euro.</desc>
