<path d="M702 172L820 138" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M812.1 136.6L820 138L814.1 143.4" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M824 126L836 138M836 126L824 138" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="844" y="136" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
<text x="844" y="152" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">writes nothing</text>
<line x1="32" y1="206" x2="928" y2="206" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="242" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Two albums</text>
<text x="32" y="262" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The parts of two albums</text>
<text x="32" y="278" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">never conflict</text>
