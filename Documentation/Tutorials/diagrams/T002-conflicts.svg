<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>An aggregate is a unit of conflict</title>
<desc>Three scenarios of two concurrent transactions, the second committing first. Both add a track to the same album: the commit of the first conflicts. They add tracks to two albums: both commit. One adds a reference to a track while the other removes its artist: the commit of the first conflicts, and writes nothing.</desc>
<rect width="960" height="442" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">An aggregate is a unit of conflict</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two concurrent transactions: the later commit conflicts when both changed the same thing</text>
<text x="32" y="130" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The same album</text>
<text x="32" y="150" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Both change Low: a rule of the</text>
<text x="32" y="166" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">album could not be broken by both</text>
<text x="310" y="136" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T1</text>
<line x1="322" y1="132" x2="830" y2="132" stroke="#4a5a62" stroke-width="1"/>
<circle cx="370" cy="132" r="4" fill="#aebcc4"/>
<text x="370" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">low.Tracks.New()</text>
<text x="830" y="120" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="310" y="180" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T2</text>
<line x1="322" y1="176" x2="690" y2="176" stroke="#4a5a62" stroke-width="1"/>
<circle cx="548" cy="176" r="4" fill="#aebcc4"/>
<text x="548" y="166" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">low.Tracks.New()</text>
<text x="690" y="164" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
