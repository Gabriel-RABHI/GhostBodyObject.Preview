<line x1="32" y1="318" x2="928" y2="318" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="354" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A target removed</text>
<text x="32" y="374" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Both change the count of</text>
<text x="32" y="390" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">the strong references of the track</text>
<text x="310" y="360" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">T1</text>
<line x1="322" y1="356" x2="830" y2="356" stroke="#4a5a62" stroke-width="1"/>
<circle cx="370" cy="356" r="4" fill="#aebcc4"/>
<text x="370" y="346" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Entries.New(track)</text>
