<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A text search and a value index combine, and the result combines again</title>
<desc>Three searches over the orders 1 to 5. OrderStatusDayIndex.Is(Paid) gives 1, 2 and 4. OrderTextIndex.Search("door") gives 1, 4 and 5. OrderTextIndex.Search("call") gives 2 and 4. The paid orders .And(door) give 1 and 4, those of both. That result, .AndNot(Search("call")), gives 1: those of the first, not of the second. A combination is a set: its orders come in no particular order.</desc>
