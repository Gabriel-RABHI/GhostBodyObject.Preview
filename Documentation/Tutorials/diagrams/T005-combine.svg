<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A text search and a value index combine, and the result combines again</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The five orders of the lesson: the paid ones of a note that says door, but not those to call first</text>
