<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A replica: the same Store on another server, each commit copied</title>
<desc>Two servers. The endpoint of the replica joins the cluster through the endpoint of the writer, its seed. Each holds the Store parcels in a directory of its own: ReadWrite in lesson-05-writer, ReadOnly in lesson-05-replica. Each commit of the writer is copied to the replica, in the order of the commits. The writer commits the parcel PX-4001 of Ada, and the replica reads the recipient Ada; the writer commits the depot Lyon, and the replica reads Lyon.</desc>
<rect width="960" height="386" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A replica: the same Store on another server, each commit copied</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">An endpoint connects each server; the writer commits, the replica reads the last commit it holds</text>
<rect x="32" y="100" width="360" height="266" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The writer</text><text x="380" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">new CarrierRepository(writerStore)</text>
<rect x="568" y="100" width="360" height="266" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="580" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The replica</text><text x="916" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">new CarrierRepository(replicaStore)</text>
<rect x="48" y="134" width="328" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="212" y="154" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">writerEndPoint</text><text x="212" y="170" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">listens on a port</text>
<rect x="584" y="134" width="328" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="748" y="154" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">replicaEndPoint</text><text x="748" y="170" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Cluster.EndPoint(writerEndPoint)</text>
<rect x="48" y="192" width="328" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="212" y="212" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">writerStore</text><text x="212" y="228" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"parcels", ReadWrite, in lesson-05-writer</text>
<rect x="584" y="192" width="328" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="748" y="212" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">replicaStore</text><text x="748" y="228" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"parcels", ReadOnly, in lesson-05-replica</text>
<rect x="48" y="250" width="328" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="212" y="270" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new Parcel(...)</text><text x="212" y="286" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-4001, Ada, then Commit()</text>
<rect x="584" y="250" width="328" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="748" y="270" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Resolve().Recipient</text><text x="748" y="286" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">"Ada"</text>
<rect x="48" y="308" width="328" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="212" y="328" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Resolve().Depot = "Lyon"</text><text x="212" y="344" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">then Commit()</text>
<rect x="584" y="308" width="328" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="748" y="328" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Resolve().Depot</text><text x="748" y="344" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">"Lyon"</text>
<path d="M584 157L383 157" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M383.2 160.6L376 157L383.2 153.4Z" fill="#aebcc4"/>
<text x="480" y="149" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">joins through its seed</text>
<path d="M376 215L577 215" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M576.8 211.4L584 215L576.8 218.6Z" fill="#3987e5"/>
<text x="480" y="207" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">each commit, in order</text>
<path d="M376 273L577 273" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M576.8 269.4L584 273L576.8 276.6Z" fill="#aebcc4"/>
<text x="480" y="265" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">CaughtUp</text>
<path d="M376 331L577 331" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M576.8 327.4L584 331L576.8 334.6Z" fill="#aebcc4"/>
<text x="480" y="323" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">CaughtUp</text>
</svg>
