<svg xmlns="http://www.w3.org/2000/svg" width="960" height="376" viewBox="0 0 960 376" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>An orphan survives its Owner, until its last retention</title>
<desc>Three stages. First, David Bowie holds the albums Low and Lodger, and an entry of the playlist Favorites designates the track Sound of Low. After bowie.Remove(), Bowie and Lodger are removed; Low survives whole, with its two tracks and no artist: an orphan. After favorites.Entries.Remove(entry), the last retention is released: Low and its tracks are removed by this very instruction.</desc>
<rect width="960" height="376" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">An orphan survives its Owner, until its last retention</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Low is [Orphanable], and an entry of the playlist retains one of its tracks</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="171" cy="94" r="3.5" fill="#aebcc4"/><circle cx="480" cy="94" r="3.5" fill="#aebcc4"/><circle cx="789" cy="94" r="3.5" fill="#aebcc4"/>
<text x="171" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the catalog</text>
<text x="480" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">bowie.Remove()</text>
<text x="789" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">favorites.Entries.Remove(entry)</text>
