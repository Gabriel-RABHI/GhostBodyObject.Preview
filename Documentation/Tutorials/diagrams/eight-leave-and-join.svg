<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A server leaves, a server joins, and nothing is lost</title>
<desc>Along the time, the office commits PX-8001. The depot joins through the office, receives that commit, commits PX-8002 and takes the write token. It then leaves, its Repository, its Store, then its endpoint, once the office holds its last commit; the token goes to another writer, or is released. The commit of PX-8003 on the office takes the token. A site joins later through the office, with an empty directory; its replica receives the whole Store, and reads PX-8001, PX-8002 and PX-8003.</desc>
<rect width="960" height="386" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A server leaves, a server joins, and nothing is lost</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The replicas of one Store along the time: each commit copied, and the write token where it is</text>
<text x="32" y="132" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The office</text>
<text x="32" y="149" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">ReadWrite</text>
<line x1="150" y1="134" x2="928" y2="134" stroke="#4a5a62" stroke-width="1"/>
<text x="32" y="224" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The depot</text>
<text x="32" y="241" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">ReadWrite</text>
<line x1="244" y1="226" x2="500" y2="226" stroke="#4a5a62" stroke-width="1"/>
<text x="32" y="316" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The site</text>
<text x="32" y="333" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">ReadOnly</text>
<line x1="636" y1="318" x2="928" y2="318" stroke="#4a5a62" stroke-width="1"/>
<path d="M190 131H368Q368 131 368 131V137Q368 137 368 137H190Z" fill="#3987e5"/>
<path d="M368 223H500Q500 223 500 223V229Q500 229 500 229H368Z" fill="#3987e5"/>
<path d="M574 131H928Q928 131 928 131V137Q928 137 928 137H574Z" fill="#3987e5"/>
<path d="M368 134L368 219" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M371.6 218.8L368 226L364.4 218.8Z" fill="#3987e5"/>
<path d="M505 220L570 141" fill="none" stroke="#3987e5" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M562.7 144.3L570 141L568.2 148.8" fill="none" stroke="#3987e5" stroke-width="1.4" stroke-linejoin="round"/>
<text x="560" y="172" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">The token goes to another</text>
<text x="560" y="187" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">writer, or is released</text>
<path d="M196 139L294.5 215.7" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M296.5 212.8L300 220L292.2 218.4Z" fill="#aebcc4"/>
<circle cx="304" cy="226" r="3.5" fill="#aebcc4"/>
<path d="M390 221L447.7 145.6" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M444.8 143.5L452 140L450.5 147.9Z" fill="#aebcc4"/>
<circle cx="456" cy="134" r="3.5" fill="#aebcc4"/>
<path d="M712 139L752.3 305.2" fill="none" stroke="#aebcc4" stroke-width="2"/><path d="M755.8 304.2L754 312L748.9 305.9Z" fill="#aebcc4"/>
<circle cx="758" cy="318" r="3.5" fill="#aebcc4"/>
<text x="752" y="230" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="start">the whole Store</text>
<circle cx="190" cy="134" r="5" fill="#e8eef1"/>
<text x="190" y="120" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">PX-8001</text>
<circle cx="384" cy="226" r="5" fill="#e8eef1"/>
<text x="384" y="248" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">PX-8002</text>
<circle cx="500" cy="226" r="5" fill="#7f9199"/>
<text x="424" y="246" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">Leaves: its Repository, its Store, its endpoint</text>
<circle cx="590" cy="134" r="5" fill="#e8eef1"/>
<text x="590" y="120" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">PX-8003</text>
<text x="636" y="338" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">Joins, through the office, with an empty directory</text>
<text x="928" y="306" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">PX-8001, PX-8002, PX-8003</text>
<path d="M32 361H58Q58 361 58 361V367Q58 367 58 367H32Z" fill="#3987e5"/>
<text x="66" y="368" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">the write token</text>
<path d="M172 364L191 364" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M190.8 360.4L198 364L190.8 367.6Z" fill="#aebcc4"/>
<text x="206" y="368" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">a commit copied</text>
<path d="M318 364L337 364" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M336.8 360.4L344 364L336.8 367.6Z" fill="#3987e5"/>
<text x="352" y="368" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">the token taken by a commit</text>
</svg>
