<title>A rule of the walk is a condition in your code</title>
<desc>The map twice. With avoidTolls false, the shortest route from Paris to Marseille goes through Lyon, on two roads with a toll, 465 km and 315 km: 780 km. With avoidTolls true, the walk skips the roads from Paris to Lyon and from Lyon to Marseille, and the route goes through Dijon, Lyon and Grenoble, 315, 195, 110 and 270 km: 890 km.</desc>
