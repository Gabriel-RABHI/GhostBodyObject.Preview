<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Each service reads the types it knows, and leaves the others</title>
<desc>The inbox of Ada holds three Records in the order of their Add: a SendBrochure, Winter offers; a CallBack, Damaged parcel; a SendBrochure, New depots. The mailing service reads Enumerate&lt;SendBrochureView&gt;(): the two brochures, the other message skipped. A service that knows both walks the inbox once, a handler per type: mail Winter offers, call Damaged parcel, mail New depots. The call center finds its message by IndexOf&lt;CallBackView&gt; and removes it by RemoveAt: the two brochures stay in their order.</desc>
<rect width="960" height="396" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Each service reads the types it knows, and leaves the others</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">ada.Inbox, a bag of any Record: three messages for two services, in the order of their Add</text>
<text x="32" y="124" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Inbox</text>
<text x="32" y="142" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">RecordBag: any Record of the model</text>
<rect x="334" y="108" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="429" y="128" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">SendBrochure</text><text x="429" y="144" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Winter offers</text>
<rect x="536" y="108" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="631" y="128" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">CallBack</text><text x="631" y="144" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Damaged parcel</text>
<rect x="738" y="108" width="190" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="833" y="128" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">SendBrochure</text><text x="833" y="144" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">New depots</text>
<line x1="32" y1="170" x2="928" y2="170" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="192" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The mailing service knows one type</text>
<text x="32" y="210" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Enumerate&lt;SendBrochureView&gt;()</text>
<rect x="334" y="184" width="190" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="429" y="208.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Winter offers</text>
<text x="631" y="208" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">skipped</text>
<rect x="738" y="184" width="190" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="833" y="208.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">New depots</text>
<line x1="32" y1="238" x2="928" y2="238" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="260" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A service that knows both</text>
<text x="32" y="278" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Enumerate(work, …, …)</text>
<text x="32" y="294" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">one walk, a handler per type</text>
<rect x="334" y="252" width="190" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="429" y="276.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">mail Winter offers</text>
<rect x="536" y="252" width="190" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="631" y="276.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">call Damaged parcel</text>
<rect x="738" y="252" width="190" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="833" y="276.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">mail New depots</text>
<line x1="32" y1="306" x2="928" y2="306" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="328" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The call center takes its message</text>
<text x="32" y="346" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">IndexOf&lt;CallBackView&gt;(out at)</text>
<text x="32" y="362" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">RemoveAt(at)</text>
<rect x="334" y="320" width="190" height="40" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="429" y="344.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Winter offers</text>
<rect x="536" y="320" width="190" height="40" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="631" y="344.3" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">Damaged parcel</text>
<rect x="738" y="320" width="190" height="40" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="833" y="344.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">New depots</text>
</svg>
