<rect x="32" y="256" width="84" height="40" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="74" y="280.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Bob</text>
<rect x="380" y="156" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="422" y="180.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Alien</text>
<rect x="380" y="256" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="422" y="280.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text>
