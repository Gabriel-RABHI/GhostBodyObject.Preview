<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A rating stands between its two ends, and both read it</title>
<desc>Two critics, Ada and Bob, and two movies, Alien and Dune. Ada gave Alien 3 stars and Dune 5 stars; Bob gave Dune 4 stars. Each rating is an entity between its critic and its movie. From the critic, ada.RatingEdges holds two ratings, whose Targets are Alien and Dune, and ada.RatingEdges.To(alien) is the rating of 3 stars. From the movie, dune.RatingEdges holds two ratings, whose Sources are Ada and Bob, and dune.RatingEdges.From(bob) is the rating of 4 stars. Bob did not rate Alien: bob.RatingEdges.To(alien) is none.</desc>
<rect width="960" height="396" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A rating stands between its two ends, and both read it</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The same three ratings, read from a critic, then from a movie</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">From the critic</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.RatingEdges</text>
