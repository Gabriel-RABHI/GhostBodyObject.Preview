<text x="496" y="324" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">dune.RatingEdges.Sources</text>
<text x="928" y="324" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">Ada, Bob</text>
<text x="496" y="346" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">dune.RatingEdges.From(bob)</text>
<text x="928" y="346" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">4 stars</text>
<line x1="32" y1="374" x2="40" y2="374" stroke="#aebcc4" stroke-width="1.4"/>
