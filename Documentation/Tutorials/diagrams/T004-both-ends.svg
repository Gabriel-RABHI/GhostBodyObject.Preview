<path d="M74 196L74 218Q74 226 82 226L212 226" fill="none" stroke="#3987e5" stroke-width="1.4"/>
<path d="M284 226L414 226Q422 226 422 234L422 256" fill="none" stroke="#3987e5" stroke-width="1.4"/>
