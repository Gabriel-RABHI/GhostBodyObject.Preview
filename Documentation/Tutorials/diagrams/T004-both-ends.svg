<text x="32" y="324" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.RatingEdges.Targets</text>
<text x="464" y="324" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">Alien, Dune</text>
