<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Each decision is right on what it read, and the rule breaks</title>
<desc>Two transactions read Ada and Bob on duty, and each one takes its own usher off duty. Without a claim both commit, because they wrote two different entities, and the hall has nobody on duty. When both claim the hall, the later commit conflicts, of the kind Claim: Ada stays on duty, and its next attempt refuses to leave.</desc>
<rect width="960" height="408" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Each decision is right on what it read, and the rule breaks</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A hall keeps one usher on duty. Each transaction reads two, and writes its own usher</text>
<text x="32" y="130" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Without a claim</text>
<text x="32" y="150" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Reads are not checked:</text>
<text x="32" y="166" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">two entities, no conflict</text>
<text x="268" y="138" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">first</text>
<line x1="280" y1="134" x2="590" y2="134" stroke="#4a5a62" stroke-width="1"/>
<circle cx="280" cy="134" r="4" fill="#aebcc4"/>
<text x="280" y="124" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<circle cx="404" cy="134" r="4" fill="#aebcc4"/>
<text x="404" y="124" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Ada leaves</text>
<path d="M584 134L588.5 138.5L596 129.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="590" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="308" y="190" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">second</text>
<line x1="320" y1="186" x2="510" y2="186" stroke="#4a5a62" stroke-width="1"/>
<circle cx="320" cy="186" r="4" fill="#aebcc4"/>
<text x="320" y="176" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<circle cx="410" cy="186" r="4" fill="#aebcc4"/>
<text x="410" y="176" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Bob leaves</text>
<path d="M504 186L508.5 190.5L516 181.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="510" y="174" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<rect x="722" y="112" width="206" height="96" rx="10" fill="none" stroke="#f07a78" stroke-width="1.5"/><text x="734" y="132" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Main hall</text><text x="916" y="132" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="end">nobody on duty</text>
<rect x="734" y="150" width="84" height="44" rx="8" fill="#47292d" stroke="#f07a78" stroke-width="1.5"/><text x="776" y="169" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Ada</text><text x="776" y="185" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">off</text>
<rect x="830" y="150" width="84" height="44" rx="8" fill="#47292d" stroke="#f07a78" stroke-width="1.5"/><text x="872" y="169" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Bob</text><text x="872" y="185" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">off</text>
<line x1="32" y1="234" x2="928" y2="234" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="284" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">With a claim</text>
<text x="32" y="304" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Both claim the hall:</text>
<text x="32" y="320" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">the later commit conflicts</text>
<text x="268" y="292" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">first</text>
<line x1="280" y1="288" x2="590" y2="288" stroke="#4a5a62" stroke-width="1"/>
<circle cx="280" cy="288" r="4" fill="#aebcc4"/>
<text x="280" y="278" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<circle cx="404" cy="288" r="4" fill="#aebcc4"/>
<text x="404" y="278" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Claim(), Ada leaves</text>
<path d="M584 282L596 294M596 282L584 294" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="590" y="276" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="604" y="292" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">Claim</text>
<text x="604" y="308" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">writes nothing</text>
<text x="308" y="344" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">second</text>
<line x1="320" y1="340" x2="510" y2="340" stroke="#4a5a62" stroke-width="1"/>
<circle cx="320" cy="340" r="4" fill="#aebcc4"/>
<text x="320" y="330" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<circle cx="410" cy="340" r="4" fill="#aebcc4"/>
<text x="410" y="330" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Claim(), Bob leaves</text>
<path d="M504 340L508.5 344.5L516 335.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="510" y="328" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<rect x="722" y="266" width="206" height="96" rx="10" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="734" y="286" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Main hall</text><text x="916" y="286" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="end">one on duty</text>
<rect x="734" y="304" width="84" height="44" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="776" y="323" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Ada</text><text x="776" y="339" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">on duty</text>
<rect x="830" y="304" width="84" height="44" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="872" y="323" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Bob</text><text x="872" y="339" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">off</text>
<text x="32" y="392" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">Run again, the first transaction reads one usher on duty, and refuses.</text>
</svg>
