<path d="M144 252L156 252Q164 252 164 260L164 271.5Q164 278 170.5 278L177 278" fill="none" stroke="#3987e5" stroke-width="1.6"/><path d="M176.8 274.4L184 278L176.8 281.6Z" fill="#3987e5"/>
