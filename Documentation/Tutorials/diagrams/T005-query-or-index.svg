<path d="M608 252L620 252Q628 252 628 244L628 232.5Q628 226 634.5 226L641 226" fill="none" stroke="#3987e5" stroke-width="1.6"/><path d="M640.8 222.4L648 226L640.8 229.6Z" fill="#3987e5"/>
