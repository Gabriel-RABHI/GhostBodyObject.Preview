<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A query reads every product, a text index those of its word</title>
<desc>Two panels over the same four products: Coffee Mug, Espresso Machine, Tea Pot and Café de Colombia. A query by LINQ, Description.Contains("coffee"), reads the text of the four products to find 2. A text index, ProductTextIndex.Search("coffee"), goes from the word to the two products that have it, Coffee Mug and Espresso Machine, and reads neither Tea Pot nor Café de Colombia. On a million products, the query reads a million descriptions, and the search still reads the products that have the word.</desc>
<rect width="960" height="434" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A query reads every product, a text index those of its word</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The four products of the lesson, and what each one reads to find coffee</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A query by LINQ</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Description.Contains("coffee")</text>
<line x1="32" y1="140" x2="464" y2="140" stroke="#2b3a42" stroke-width="1"/>
<rect x="32" y="228" width="112" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="88" y="247.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Each text</text><text x="88" y="264.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">every character</text>
<rect x="184" y="152" width="280" height="44" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="324" y="171" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Coffee Mug</text><text x="324" y="187" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">A white mug for your morning coffee.</text>
<path d="M144 252L156 252Q164 252 164 244L164 180.5Q164 174 170.5 174L177 174" fill="none" stroke="#3987e5" stroke-width="1.6"/><path d="M176.8 170.4L184 174L176.8 177.6Z" fill="#3987e5"/>
<rect x="184" y="204" width="280" height="44" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="324" y="223" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Espresso Machine</text><text x="324" y="239" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">Brews a strong coffee in 30 seconds.</text>
