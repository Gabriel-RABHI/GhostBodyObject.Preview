<rect x="648" y="308" width="280" height="44" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="788" y="327" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Café de Colombia</text><text x="788" y="343" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Beans roasted in Medellín.</text>
<text x="504" y="386" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">2</text>
<text x="520" y="385" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="start">products read, to find 2</text>
<text x="32" y="416" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">On a million products, the query reads a million descriptions; the search still reads the products that have the word</text>
