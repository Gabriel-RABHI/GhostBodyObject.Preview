<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>One walk gives each Record to the handler of its type, in their order</title>
<desc>Two columns on the same four Records: CheckedIn room 12, RoomChanged 12 to 14, RoomChanged 14 to 16, CheckedOut. With three handlers, one walk gives each Record to the handler of its type, in their order, and the story reads in 12, to 14, to 16, out. With one handler, for RoomChanged, the Records of the other types are skipped, and rooms reads 14, 16.</desc>
