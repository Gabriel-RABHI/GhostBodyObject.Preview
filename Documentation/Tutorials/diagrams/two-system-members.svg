<svg xmlns="http://www.w3.org/2000/svg" width="960" height="348" viewBox="0 0 960 348" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A system holds the entities that have its components</title>
<desc>Two tables of four artists and their components. At first Bowie has a tour and is verified, Eno has a tour, Reed has a tour and is retired, Iggy has nothing: the system holds Bowie and Eno. After iggy.Tour.New() and eno.Retired.New(), it holds Bowie and Iggy, at the next instruction.</desc>
