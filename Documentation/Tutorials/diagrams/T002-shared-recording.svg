<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A shared object lives as long as its strong references</title>
<desc>Four steps. A track of the album Low is born with a new recording: 1 strong reference. A track of the compilation Best of designates the same recording: 2. The album Low is removed with its track: 1, and the recording lives. The compilation is removed: nothing retains the recording, removed by the same instruction.</desc>
<rect width="960" height="368" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A shared object lives as long as its strong references</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">No Owner, no Remove(): the tracks that designate a recording keep it alive</text>
