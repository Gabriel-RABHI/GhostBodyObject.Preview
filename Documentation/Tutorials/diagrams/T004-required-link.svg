<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A membership retains its role, until it is given another</title>
<desc>Five steps. ada.NewMembership(club, member) makes the membership of Ada in the chess club, which retains the role Member by a strong reference. member.Remove() is refused. TryGetOrNew(club, admin, out found) compares the role: it gives the membership, and false. found.Role = admin moves the strong reference to the role Admin. member.Remove() passes: the role Member is free.</desc>
<rect width="960" height="372" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A membership retains its role, until it is given another</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Ada in the chess club: the role is a required link of the edge, given to its birth</text>
