<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A concurrency point makes an aggregate one domain of conflict</title>
<desc>A basket without a point: the first transaction writes the Carmen line, the second writes the Tosca line, nothing is written in common, both commit, and the basket holds seven tickets, breaking the rule. An order with ConcurrencyPoint: each change of a line marks the order, so both transactions write the order, and the second one conflicts, of the kind Domain. The order holds six tickets.</desc>
<rect width="960" height="320" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A concurrency point makes an aggregate one domain of conflict</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Six tickets at most, all lines together. Each transaction reads five, and raises one line</text>
<rect x="32" y="110" width="420" height="134" rx="10" fill="none" stroke="#f07a78" stroke-width="1.5"/><text x="44" y="130" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Basket</text><text x="440" y="130" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="end">nothing in common</text>
<rect x="48" y="166" width="186" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="141" y="187" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Carmen: 3 + 1</text><text x="141" y="203" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">first transaction</text>
<rect x="250" y="166" width="186" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="343" y="187" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Tosca: 2 + 1</text><text x="343" y="203" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">second transaction</text>
<text x="242" y="268" font-size="13" font-weight="600" fill="#f07a78" text-anchor="middle">both commit: 7 tickets</text>
<rect x="508" y="110" width="420" height="134" rx="10" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="520" y="130" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">[ConcurrencyPoint] Order</text><text x="916" y="130" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="end">both mark it</text>
<rect x="524" y="166" width="186" height="48" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="617" y="187" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Carmen: 3 + 1</text><text x="617" y="203" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">first transaction</text>
<rect x="726" y="166" width="186" height="48" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="819" y="187" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Tosca: 2 + 1</text><text x="819" y="203" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">second transaction</text>
<text x="718" y="268" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">the second conflicts, Domain: 6 tickets</text>
<text x="32" y="302" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A line added or removed changes its Owner, in both. The point adds the values of the lines, at any depth, without anyone asking.</text>
</svg>
