<svg xmlns="http://www.w3.org/2000/svg" width="960" height="434" viewBox="0 0 960 434" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Three relations, three answers when an end goes</title>
<desc>Three columns. A like is a collection of weak references from the user Ada to a post: post.Remove() removes the post, and the like leaves the collection. A reaction is an edge between Ada and the post, of the kind Insightful: post.Remove() removes the post, and the reaction with it. A transfer of 120 is a Root with a strong reference to the account savings and one to the account current: savings.Remove() is refused, and nothing changes.</desc>
