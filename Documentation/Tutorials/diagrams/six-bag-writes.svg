<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A removal moves the Records after it down</title>
<desc>A bag of six Records, CleanRoom 12, 14, 12, 16, 12 and a Breakfast, at positions 0 to 5. RemoveAt(1) removes CleanRoom 14, and the four Records after it move down by one place. Remove of CleanRoom 16 removes the first equal value and returns true. Remove of CleanRoom 99 finds none and returns false: nothing moves. RemoveAll of CleanRoom 12 removes the three equal values, returns 3, and the Breakfast comes to position 0. Add puts CleanRoom 14 at the end. RemoveAll&lt;BreakfastView&gt;() removes the Breakfast, returns 1, and CleanRoom 14 moves down. Clear() empties the bag.</desc>
<rect width="960" height="412" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A removal moves the Records after it down</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The positions of a bag, instruction by instruction: dashed, what it removes; blue, what it moves down or adds</text>
<text x="32" y="112" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">stay.Requests</text>
<text x="353" y="112" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">0</text>
<text x="436" y="112" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">1</text>
<text x="519" y="112" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">2</text>
<text x="602" y="112" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">3</text>
<text x="685" y="112" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">4</text>
