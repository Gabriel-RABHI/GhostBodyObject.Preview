<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The whole catalog: what holds what</title>
<desc>The model of Lesson 20. An artist, a Root, holds its orphanable albums, which hold their tracks. A playlist holds its entries. A festival designates artists by strong references; a listener designates albums by weak references; an entry designates a track. An album designates a genre, a Root that is never removed. A track designates a recording, shared, and a recording its lyrics, shared.</desc>
<rect width="960" height="416" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The whole catalog: what holds what</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Each aggregate is a box; the arrows cross from one to another, or reach what no one owns</text>
<rect x="32" y="106" width="170" height="44" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="117" y="125" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Festival</text><text x="117" y="141" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">[Root, Removable]</text>
<rect x="32" y="158" width="170" height="44" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="117" y="177" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Listener</text><text x="117" y="193" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">[Root, Removable]</text>
<rect x="32" y="214" width="170" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="234" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Playlist</text><text x="190" y="234" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">[Root, Removable]</text>
<rect x="46" y="246" width="142" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="117" y="266" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Entry</text><text x="117" y="282" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">a part</text>
<rect x="346" y="100" width="288" height="212" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="358" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Artist</text><text x="622" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">[Root, Removable]</text>
<rect x="362" y="134" width="256" height="164" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="374" y="154" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Album</text><text x="606" y="154" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">[Orphanable]</text>
<rect x="378" y="246" width="224" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="490" y="266" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Track</text><text x="490" y="282" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">a part of its album</text>
<rect x="716" y="158" width="212" height="44" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="822" y="177" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Genre</text><text x="822" y="193" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">[Root]: never removed</text>
<rect x="716" y="246" width="212" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="822" y="266" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Recording</text><text x="822" y="282" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">shared: no Owner, no Remove()</text>
<rect x="716" y="332" width="212" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="822" y="352" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Lyrics</text><text x="822" y="368" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">shared</text>
