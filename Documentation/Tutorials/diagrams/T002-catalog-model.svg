<path d="M188 269L371 269" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M370.8 265.4L378 269L370.8 272.6Z" fill="#aebcc4"/>
<text x="274" y="261" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Track</text>
<path d="M618 180L709 180" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 176.4L716 180L708.8 183.6Z" fill="#aebcc4"/>
<text x="667" y="172" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Genre</text>
<path d="M602 269L709 269" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 265.4L716 269L708.8 272.6Z" fill="#aebcc4"/>
<text x="667" y="261" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Recording</text>
<path d="M822 292L822 325" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M825.6 324.8L822 332L818.4 324.8Z" fill="#aebcc4"/>
<text x="832" y="316" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Lyrics</text>
<path d="M32 394L51 394" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M50.8 390.4L58 394L50.8 397.6Z" fill="#aebcc4"/><text x="66" y="398" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">strong reference</text><path d="M180.8 394L206.8 394" fill="none" stroke="#aebcc4" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M199.6 390.4L206.8 394L199.6 397.6" fill="none" stroke="#aebcc4" stroke-width="1.4" stroke-linejoin="round"/><text x="214.8" y="398" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">weak reference</text><rect x="318" y="387" width="20" height="14" rx="3" fill="none" stroke="#4a5a62" stroke-width="1"/><rect x="323" y="391" width="10" height="6" rx="1.5" fill="#4a5a62"/><text x="346" y="398" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">a part, in its Owner</text>
</svg>
