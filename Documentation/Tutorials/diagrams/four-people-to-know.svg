<svg xmlns="http://www.w3.org/2000/svg" width="960" height="348" viewBox="0 0 960 348" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Two steps give the friends of friends, and your code ranks them</title>
<desc>Ada is the friend of Bob and of Cid. The friends of Bob are Ada and Dan; those of Cid are Ada, Dan and Eve. Leaving out Ada and the friends of Ada, two people are left: Dan, who shares 2 friends with Ada, Bob and Cid, and Eve, who shares 1, Cid. PeopleToKnow(ada) gives Dan, then Eve.</desc>
