<rect x="168" y="184" width="98" height="30" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="217" y="203.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Forced</text>
<rect x="272" y="184" width="98" height="30" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="321" y="203.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Left open</text>
<text x="480" y="153" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">front.AlarmLog.Remove()</text>
