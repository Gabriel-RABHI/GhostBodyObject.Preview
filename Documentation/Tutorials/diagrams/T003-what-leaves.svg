<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A capability never outlives its entity, and never ends it</title>
<desc>Two removals. The Front door has a battery at level 80 and an alarm log of two alarms. front.AlarmLog.Remove() removes the log with its alarms; the lock stays, with its battery. In the second one, the Front door has a battery and an alarm log of one alarm, and the Back door a battery at level 60. front.Remove() removes the lock with its battery, its log and its alarm; the Back door and its battery stay.</desc>
<rect width="960" height="494" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A capability never outlives its entity, and never ends it</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two removals: the target in blue, and what leaves with it</text>
<rect x="32" y="100" width="104" height="126" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="84" y="167.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Front door</text>
<line x1="136" y1="122" x2="156" y2="122" stroke="#4a5a62" stroke-width="1.2"/>
<line x1="136" y1="189" x2="156" y2="189" stroke="#4a5a62" stroke-width="1.2"/>
