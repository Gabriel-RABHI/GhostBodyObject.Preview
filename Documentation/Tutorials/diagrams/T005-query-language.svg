<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A word requires, + adds, - takes off</title>
<desc>Five products and five words. Coffee Mug has coffee and mug. Espresso Machine has coffee. Tea Pot has tea and pot. Tea Mug has coffee, tea and mug. Espresso Cups has cups. The query tea +cups finds Tea Pot, Tea Mug and Espresso Cups. The query coffee -tea finds Coffee Mug and Espresso Machine: Tea Mug has coffee, and tea excludes it. The query -mug -pot starts from every product and finds Espresso Machine and Espresso Cups.</desc>
<rect width="960" height="396" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A word requires, + adds, - takes off</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The five products of the lesson, the words they have, and what three queries find</text>
