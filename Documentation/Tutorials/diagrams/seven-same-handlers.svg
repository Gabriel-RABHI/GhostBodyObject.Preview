<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A command and a replay run the same handler</title>
<desc>A command, Parcels.Scan(ada, "Lyon"), runs in a transaction of the Repository and of the Log: it adds the Record ParcelScanned to the Log by Add(), and gives its View to Apply by ToView(). A replay, Replay.Run, runs in a Replay transaction, which opens no transaction of the Log: a subscription from the start of the Log gives the same Record, as a View, to the same Apply. Apply reads the values of its Record only, and changes the parcel. In a Replay transaction, ParcelRef.New() is refused: the identities come from the Records.</desc>
<rect width="960" height="396" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A command and a replay run the same handler</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A command adds its Record, a replay finds it in the Log; both give its View to Apply</text>
<rect x="32" y="134" width="200" height="72" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="132" y="157" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A command</text><text x="132" y="174" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Parcels.Scan(ada, "Lyon")</text><text x="132" y="191" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">with a transaction of the Log</text>
<rect x="32" y="262" width="200" height="72" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="132" y="285" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A replay</text><text x="132" y="302" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Replay.Run(...)</text><text x="132" y="319" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">a Replay transaction: none of the Log</text>
<text x="32" y="104" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">Who starts it</text>
<text x="356" y="104" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">The Log</text>
<text x="632" y="104" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">The handler</text>
<text x="796" y="104" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">The model</text>
<rect x="356" y="134" width="156" height="200" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="434" y="212.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A Record</text><text x="434" y="229.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ParcelScanned</text><text x="434" y="246.5" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Parcel = ada</text><text x="434" y="263.5" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Depot = "Lyon"</text>
<path d="M232 170L349 170" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M348.8 166.4L356 170L348.8 173.6Z" fill="#aebcc4"/>
