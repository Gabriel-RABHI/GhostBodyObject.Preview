<rect x="796" y="134" width="132" height="200" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="862" y="212.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">The parcel</text><text x="862" y="229.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">InTransit</text><text x="862" y="246.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">Lyon</text><text x="862" y="263.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle">Scans + 1</text>
<text x="32" y="378" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">In a Replay transaction, ParcelRef.New() is refused: the identities come from the Records</text>
