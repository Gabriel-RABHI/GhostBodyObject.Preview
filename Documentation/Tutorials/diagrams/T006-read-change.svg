<text x="684.3" y="227.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">3.5 KB</text>
<path d="M672 254H854Q858 254 858 258V264Q858 268 854 268H672Z" fill="#3987e5"/>
<text x="866" y="265.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">150 KB</text>
<path d="M672 272H674Q676.1 272 676.1 274.046V283.954Q676.1 286 674 286H672Z" fill="#66757d"/>
<text x="684.1" y="283.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">3.3 KB</text>
<text x="672" y="320" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start">One change rewrites the bag</text>
<text x="112" y="163" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="end">10 lines</text>
<text x="112" y="219" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="end">100 lines</text>
<text x="112" y="275" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="end">1,000 lines</text>
<text x="32" y="354" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A thousand bills of each kind, one thread, a Store in memory, each line changed in a transaction of its own · Intel i9-9900K, .NET 10</text>
</svg>
