<path d="M672 160H674.1Q676.2 160 676.2 162.108V171.892Q676.2 174 674.1 174H672Z" fill="#66757d"/>
<text x="684.2" y="171.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">3.4 KB</text>
<path d="M672 198H689.6Q693.6 198 693.6 202V208Q693.6 212 689.6 212H672Z" fill="#3987e5"/>
<text x="701.6" y="209.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">17.4 KB</text>
