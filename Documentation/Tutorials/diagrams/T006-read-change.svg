<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Records read faster at any size, and change slower as the bag grows</title>
<desc>The measures of the lesson as bars, Records against parts, for 10, 100 and 1,000 lines in the bill. Reading a line through the Views: 173, 193, 196 M/s for Records, 40, 42, 43 M/s for parts. Changing one line: 434,000, 136,000, 15,800 changes/s for Records, 479,000, 399,000, 105,900 for parts. Allocated per change: 4.0, 17.4, 150 KB for Records, 3.4, 3.5, 3.3 KB for parts. Records read 4 to 5 times faster at any size, and change 7 times slower at 1,000 lines: one change rewrites the bag.</desc>
<rect width="960" height="372" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Records read faster at any size, and change slower as the bag grows</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The two bills of Lesson 13 · each column on its own linear scale</text>
<rect x="806" y="58" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="824" y="68" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Records</text>
<rect x="882" y="58" width="12" height="12" rx="3" fill="#66757d"/>
<text x="900" y="68" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">parts</text>
<text x="124" y="106" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Read a line</text>
<text x="124" y="122" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">through the Views</text>
<line x1="124" y1="132" x2="124" y2="294" stroke="#4a5a62" stroke-width="1"/>
<path d="M124 142H284.2Q288.2 142 288.2 146V152Q288.2 156 284.2 156H124Z" fill="#3987e5"/>
<text x="296.2" y="153.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">173 M/s</text>
<path d="M124 160H158Q162 160 162 164V170Q162 174 158 174H124Z" fill="#66757d"/>
<text x="170" y="171.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">40 M/s</text>
<path d="M124 198H303.2Q307.2 198 307.2 202V208Q307.2 212 303.2 212H124Z" fill="#3987e5"/>
<text x="315.2" y="209.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">193 M/s</text>
<path d="M124 216H159.9Q163.9 216 163.9 220V226Q163.9 230 159.9 230H124Z" fill="#66757d"/>
<text x="171.9" y="227.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">42 M/s</text>
<path d="M124 254H306Q310 254 310 258V264Q310 268 306 268H124Z" fill="#3987e5"/>
<text x="318" y="265.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">196 M/s</text>
<path d="M124 272H160.8Q164.8 272 164.8 276V282Q164.8 286 160.8 286H124Z" fill="#66757d"/>
<text x="172.8" y="283.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">43 M/s</text>
<text x="124" y="320" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start">4 to 5 times faster, at any size</text>
<text x="398" y="106" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Change one line</text>
<text x="398" y="122" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">in a transaction of its own</text>
<line x1="398" y1="132" x2="398" y2="294" stroke="#4a5a62" stroke-width="1"/>
<path d="M398 142H562.5Q566.5 142 566.5 146V152Q566.5 156 562.5 156H398Z" fill="#3987e5"/>
<text x="574.5" y="153.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">434,000/s</text>
<path d="M398 160H580Q584 160 584 164V170Q584 174 580 174H398Z" fill="#66757d"/>
<text x="592" y="171.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">479,000/s</text>
<path d="M398 198H446.8Q450.8 198 450.8 202V208Q450.8 212 446.8 212H398Z" fill="#3987e5"/>
<text x="458.8" y="209.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">136,000/s</text>
<path d="M398 216H548.9Q552.9 216 552.9 220V226Q552.9 230 548.9 230H398Z" fill="#66757d"/>
<text x="560.9" y="227.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">399,000/s</text>
<path d="M398 254H401.1Q404.1 254 404.1 257.06764091858037V264.93235908141963Q404.1 268 401.1 268H398Z" fill="#3987e5"/>
