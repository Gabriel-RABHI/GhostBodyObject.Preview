<path d="M398 272H435.1Q439.1 272 439.1 276V282Q439.1 286 435.1 286H398Z" fill="#66757d"/>
<text x="447.1" y="283.5" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">105,900/s</text>
<text x="398" y="320" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start">7 times slower at 1,000 lines</text>
<text x="672" y="106" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Allocated per change</text>
<text x="672" y="122" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">the same at any size for a part</text>
