<line x1="32" y1="272" x2="928" y2="272" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="302" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A handler for one type</text>
<text x="32" y="321" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Handle&lt;ParcelScannedView&gt;</text>
<line x1="252" y1="308" x2="928" y2="308" stroke="#4a5a62" stroke-width="1"/>
<circle cx="332" cy="308" r="4.5" fill="#1a252b"/>
<circle cx="332" cy="308" r="4.5" fill="none" stroke="#7f9199" stroke-width="1"/>
<circle cx="480" cy="308" r="4.5" fill="#3987e5"/>
<circle cx="664" cy="308" r="4.5" fill="#3987e5"/>
<circle cx="848" cy="308" r="4.5" fill="#1a252b"/>
<circle cx="848" cy="308" r="4.5" fill="none" stroke="#7f9199" stroke-width="1"/>
<text x="332" y="328" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">skipped</text>
<text x="480" y="296" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Lyon</text>
<text x="664" y="296" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Paris</text>
<text x="848" y="328" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">skipped</text>
<line x1="32" y1="348" x2="928" y2="348" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="378" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A handler that answers Cancel</text>
<text x="32" y="397" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">LogStoreSubscription.Cancel</text>
<line x1="252" y1="384" x2="480" y2="384" stroke="#4a5a62" stroke-width="1"/>
<circle cx="332" cy="384" r="4.5" fill="#1a252b"/>
<circle cx="332" cy="384" r="4.5" fill="none" stroke="#7f9199" stroke-width="1"/>
<circle cx="480" cy="384" r="4.5" fill="#3987e5"/>
<text x="332" y="404" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">skipped</text>
<text x="480" y="372" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Lyon</text>
<line x1="488" y1="377" x2="488" y2="391" stroke="#aebcc4" stroke-width="2"/>
<text x="594" y="380" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start">Cancel: the Records after it are not delivered</text>
<text x="594" y="399" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Completion.IsCompletedSuccessfully</text>
</svg>
