<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>What composes a party: components, parts, references and systems</title>
<desc>The model of Lessons 8 to 10. A party, a Root, has four components: a customer, a supplier, an employee and a block. The offers are parts of the supplier. An order, a Root, retains the customer by a strong reference. The system STradingPartner, the customers and suppliers at once, requires the customer and the supplier. The system SActiveCustomer, the customers not blocked, requires the customer, reads the employee as optional, and excludes the block.</desc>
<rect width="960" height="450" rx="14" fill="#1a252b"/>
