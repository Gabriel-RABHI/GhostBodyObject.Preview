<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A walk in breadth: each frontier gives the next one</title>
<desc>The map of the lesson, from Paris. One road away, Paris reaches Lyon, Dijon and Lille. Two roads away, Lyon reaches Marseille and Grenoble; Dijon reaches only Lyon, met already, which the walk does not take again. Reachable(paris, roads: 1) gives Dijon, Lille and Lyon. Reachable(paris, roads: 2) gives Dijon, Grenoble, Lille, Lyon and Marseille. Nice, a third road away, is not reached. The roads from Paris to Lyon, from Lyon to Marseille and from Marseille to Nice have a toll.</desc>
<rect width="960" height="408" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A walk in breadth: each frontier gives the next one</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The cities within two roads of Paris, each met once</text>
<text x="84" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">The start</text>
<text x="84" y="120" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">paris</text>
<text x="348" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">One road</text>
<text x="348" y="120" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">roads: 1</text>
<text x="612" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Two roads</text>
<text x="612" y="120" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">roads: 2</text>
<text x="876" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Not reached</text>
