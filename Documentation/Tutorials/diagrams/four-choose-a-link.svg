<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>From the need to the link</title>
<desc>Questions in their order. A relation that carries no value is a collection of references, [Weak] IEntityCollection&lt;T&gt;, with its reverse property. One that belongs to one of its ends is a composition. One that must not vanish with either end is a Root with strong references, which retain its ends. Otherwise it is an edge. Which edge? One per pair: [Edge(nameof(MA), nameof(MB))]. Several per pair: Multiple = true. No direction: Symmetric = true, between one type.</desc>
<rect width="960" height="476" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">From the need to the link</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Three answers make an edge; then its declaration says how many, and in which direction</text>
<text x="32" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Is it an edge?</text>
<rect x="32" y="118" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="145.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Does the relation</text><text x="128" y="162.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">carry values?</text>
<path d="M224 150L245 150" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 146.4L252 150L244.8 153.6Z" fill="#aebcc4"/>
<text x="238" y="143" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">no</text>
<rect x="252" y="118" width="212" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="358" y="137" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A collection of references</text><text x="358" y="154" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Weak] IEntityCollection&lt;T&gt;</text><text x="358" y="171" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">and its reverse property</text>
<path d="M128 182L128 195" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M131.6 194.8L128 202L124.4 194.8Z" fill="#aebcc4"/>
<text x="136" y="196" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">yes</text>
<rect x="32" y="202" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="229.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Does it belong to</text><text x="128" y="246.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">one of its ends?</text>
<path d="M224 234L245 234" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 230.4L252 234L244.8 237.6Z" fill="#aebcc4"/>
<text x="238" y="227" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="202" width="212" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="358" y="229.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A composition</text><text x="358" y="246.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">born in its Owner, leaves with it only</text>
<path d="M128 266L128 279" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M131.6 278.8L128 286L124.4 278.8Z" fill="#aebcc4"/>
<text x="136" y="280" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<rect x="32" y="286" width="192" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="313.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Must it vanish</text><text x="128" y="330.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">with either end?</text>
<path d="M224 318L245 318" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 314.4L252 318L244.8 321.6Z" fill="#aebcc4"/>
<text x="238" y="311" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">no</text>
<rect x="252" y="286" width="212" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="358" y="305" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A Root</text><text x="358" y="322" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">with strong references,</text><text x="358" y="339" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">which retain its ends</text>
<path d="M128 350L128 363" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M131.6 362.8L128 370L124.4 362.8Z" fill="#aebcc4"/>
<text x="136" y="364" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">yes</text>
<rect x="32" y="370" width="432" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="248" y="397.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">An edge</text><text x="248" y="414.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">a relation between two ends, removed with either</text>
<text x="496" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Which edge?</text>
<rect x="496" y="118" width="192" height="232" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="592" y="229.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">One per pair, several,</text><text x="592" y="246.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">or no direction?</text>
<path d="M688 150L709 150" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 146.4L716 150L708.8 153.6Z" fill="#aebcc4"/>
<rect x="716" y="118" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="145.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">One per pair</text><text x="822" y="162.5" font-size="11" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Edge(nameof(MA), nameof(MB))]</text>
<path d="M688 234L709 234" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 230.4L716 234L708.8 237.6Z" fill="#aebcc4"/>
<rect x="716" y="202" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="229.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Several per pair</text><text x="822" y="246.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Multiple = true</text>
<path d="M688 318L709 318" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 314.4L716 318L708.8 321.6Z" fill="#aebcc4"/>
<rect x="716" y="286" width="212" height="64" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="305" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">No direction</text><text x="822" y="322" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Symmetric = true</text><text x="822" y="339" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">between one type</text>
<path d="M464 402L584 402Q592 402 592 394L592 357" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M588.4 357.2L592 350L595.6 357.2Z" fill="#aebcc4"/>
<text x="32" y="458" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A question that goes beyond one edge is your walk, by the Views, over the edges of each end</text>
</svg>
