<text x="32" y="308" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Changes of different books</text>
<text x="32" y="324" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">never conflict</text>
<text x="250" y="294" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">first</text>
