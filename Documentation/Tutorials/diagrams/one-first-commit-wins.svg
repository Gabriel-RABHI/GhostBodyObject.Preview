<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 0 960 362" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The first commit wins, the other one writes nothing</title>
<desc>Two scenarios. Both transactions change Dune, at 9.90: the first sets 12.50, the second sets 11.00 and commits first; the commit of the first throws a TransactionConflictException and writes nothing. The application decides: a new transaction reads 11.00, sets 12.50 and commits. In the second scenario, the transactions change Dune and Foundation: both commit.</desc>
<rect width="960" height="362" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The first commit wins, the other one writes nothing</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two concurrent transactions: the later commit conflicts when both changed the same book</text>
<text x="32" y="134" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The same book</text>
<text x="32" y="154" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Each changes its own version of</text>
<text x="32" y="170" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Dune, at 9.90. GBO never retries:</text>
<text x="32" y="186" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">the application decides</text>
<text x="250" y="140" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">first</text>
<line x1="262" y1="136" x2="700" y2="136" stroke="#4a5a62" stroke-width="1"/>
<circle cx="262" cy="136" r="4" fill="#aebcc4"/>
<text x="262" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<circle cx="360" cy="136" r="4" fill="#aebcc4"/>
<text x="360" y="126" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Price = 12.50</text>
<path d="M694 130L706 142M706 130L694 142" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="700" y="124" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="714" y="140" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
<text x="714" y="156" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">writes nothing</text>
<text x="392" y="184" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">second</text>
