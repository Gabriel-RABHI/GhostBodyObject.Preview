<circle cx="404" cy="180" r="4" fill="#aebcc4"/>
<text x="404" y="170" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<circle cx="478" cy="180" r="4" fill="#aebcc4"/>
<text x="478" y="170" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Price = 11.00</text>
<path d="M566 180L570.5 184.5L578 175.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
