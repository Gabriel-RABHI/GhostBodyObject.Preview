<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>An artist can be removed once nothing designates it</title>
<desc>Five steps. Two albums designate Bowie: 2 strong references. Low designates Brian Eno instead: 1. bowie.Remove() is refused, and the count stays 1. heroes.Remove() releases the last reference: 0. bowie.Remove() passes, and Bowie is removed.</desc>
