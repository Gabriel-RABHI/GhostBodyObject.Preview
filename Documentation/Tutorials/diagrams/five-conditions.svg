<text x="32" y="148" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">the order of their dates</text>
<text x="305" y="104" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="start">Monday</text>
<text x="557" y="104" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="start">Tuesday</text>
