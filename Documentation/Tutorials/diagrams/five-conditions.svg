<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Each condition takes a stretch of the index</title>
<desc>The ten orders 1040 to 1049, one every four hours from Monday 09:00 to Tuesday 21:00, in the order of their dates. From(tuesday) takes 1044 to 1049; Before(tuesday) takes 1040 to 1043. Between(Monday, Monday.AddHours(8)) takes 1040 and 1041, and leaves out its end, 1042. Range with the same bounds takes 1040, 1041 and 1042, its end included. Every takes the ten orders.</desc>
<rect width="960" height="390" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Each condition takes a stretch of the index</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">OrderPlacedIndex and the ten orders of the lesson, always in the order of their dates</text>
