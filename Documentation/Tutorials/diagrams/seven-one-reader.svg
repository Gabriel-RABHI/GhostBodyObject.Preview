<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>One reader, each Record to its handler, in the order of the Store</title>
<desc>Two Logs, parcels and routes, on one Log Store, journal. parcels commits ParcelRegistered, routes commits RoutePlanned, parcels commits ParcelScanned. The journal holds the three Records in that order. One reader, journal.Replay(from: 0), holds the handlers that each Log registers by On(replay), and gives each Record to its handler in the order of the Store: seen is registered PX-1201, planned PX-1201, scanned PX-1201.</desc>
<rect width="960" height="410" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">One reader, each Record to its handler, in the order of the Store</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two Logs on one Log Store: their commits by turns, read as one journal</text>
<text x="32" y="118" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Two Logs, by turns</text>
<text x="32" y="137" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction.Commit()</text>
<rect x="204" y="172" width="724" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="216" y="192" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start"></text>
<text x="32" y="216" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">One Log Store</text>
<text x="32" y="235" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">journal</text>
<rect x="204" y="280" width="724" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="216" y="300" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start"></text>
<text x="32" y="322" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">One reader</text>
<text x="32" y="341" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">journal.Replay(from: 0)</text>
<text x="32" y="394" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">seen</text>
