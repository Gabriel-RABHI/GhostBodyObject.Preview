<svg xmlns="http://www.w3.org/2000/svg" width="960" height="406" viewBox="0 0 960 406" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The copy of a bag is free: to change, and to assign to another stay</title>
<desc>Five instructions, three bags. ada.Charges receives a charge, Room. ada.ToView().Charges.ToBody() gives copy, a free bag that holds Room. copy.Add adds Parking to the copy alone: ada.Charges still counts 1. The new stay of Bob receives the copy by Charges = copy, and holds Room and Parking. ada.Charges.Clear() empties the bag of Ada: the stay of Bob keeps its two charges.</desc>
<rect width="960" height="406" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The copy of a bag is free: to change, and to assign to another stay</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The Records of each bag, at each instruction</text>
<text x="350" y="110" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Charges</text>
<text x="350" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">bound to the stay of Ada</text>
<text x="558" y="110" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">copy</text>
<text x="558" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">free: it belongs to nothing</text>
<text x="766" y="110" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">bob.Charges</text>
<text x="766" y="126" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">bound to the stay of Bob</text>
<text x="32" y="164" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.Charges.Add(new Charge { ... })</text>
