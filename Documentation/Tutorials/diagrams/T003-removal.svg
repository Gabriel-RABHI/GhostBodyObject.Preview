<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>What a removal does follows from the declarations</title>
<desc>Three stages. Acme has a customer role, retained by an order of 1,200, and a supplier role with its offers Steel and Copper. acme.Supplier.Remove() removes the role with its offers: a part follows its role. acme.Customer.Remove() and acme.Remove() are refused: the strong reference of the order retains the role and its party, and nothing changes. order.Remove() then acme.Remove(): the order closed, the role and the party go.</desc>
<rect width="960" height="372" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">What a removal does follows from the declarations</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A party that supplies two offers, and that placed an order: the removals of the test, in their order</text>
