<text x="480" y="118" font-size="12" font-weight="400" fill="#f07a78" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">acme.Customer.Remove()</text>
<text x="480" y="134" font-size="12" font-weight="400" fill="#f07a78" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">acme.Remove()</text>
