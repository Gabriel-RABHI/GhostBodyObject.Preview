<text x="280" y="155" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ArtistRef</text>
<text x="408" y="155" font-size="12" font-weight="600" fill="#3987e5" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">a</text>
<rect x="268" y="182" width="152" height="38" rx="6" fill="#233139" stroke="#4a5a62" stroke-width="1"/>
