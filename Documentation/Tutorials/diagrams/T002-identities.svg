<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A command and its Replay create the same graph</title>
<desc>A command draws the identities a, b, c, d and e, and writes them in the event AlbumReleased. The event is applied by one code, Apply, in the transaction of the command and in a Replay transaction. Both create the same graph, with the same identities. In a Replay, ArtistRef.New() throws.</desc>
<rect width="960" height="390" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A command and its Replay create the same graph</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The command draws every identity once; the event carries them; one code applies it</text>
<rect x="32" y="130" width="158" height="64" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="111" y="157.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A command</text><text x="111" y="174.5" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">draws every identity</text>
