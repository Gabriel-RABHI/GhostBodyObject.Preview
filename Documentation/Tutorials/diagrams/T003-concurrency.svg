<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A role changes in parallel with its party, until it is given or taken</title>
<desc>Two scenarios of two concurrent transactions, the second committing first. The sales team sets the credit limit of the customer role to 25,000, the legal team renames the party Acme Corporation: two aggregates, both commit, and both values stay. In the second one, both transactions give the party its customer role, by GrantCredit(5_000m) and GrantCredit(8_000m): the second commits, the first conflicts. The retry runs the same code: GetOrNew finds the role of 8,000 that the other transaction gave, changes it to 5,000, and commits.</desc>
<rect width="960" height="382" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A role changes in parallel with its party, until it is given or taken</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two concurrent transactions, the first one committing last</text>
<text x="32" y="130" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A role and its party</text>
<text x="32" y="150" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Two aggregates: each one</text>
<text x="32" y="166" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">conflicts only with itself</text>
<text x="248" y="136" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">sales</text>
<line x1="260" y1="132" x2="680" y2="132" stroke="#4a5a62" stroke-width="1"/>
<circle cx="330" cy="132" r="4" fill="#aebcc4"/>
<text x="330" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">CreditLimit = 25_000m</text>
<text x="680" y="120" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="248" y="180" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">legal</text>
<line x1="260" y1="176" x2="560" y2="176" stroke="#4a5a62" stroke-width="1"/>
<circle cx="430" cy="176" r="4" fill="#aebcc4"/>
<text x="430" y="166" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Name = "Acme Corporation"</text>
<text x="560" y="164" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M554 176L558.5 180.5L566 171.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M674 132L678.5 136.5L686 127.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="694" y="136" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">committed</text>
<text x="694" y="152" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">both values stay</text>
<line x1="32" y1="206" x2="928" y2="206" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="242" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">A role given twice</text>
<text x="32" y="262" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Giving a capability changes</text>
<text x="32" y="278" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">the capabilities of its entity</text>
<text x="248" y="248" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">first</text>
<line x1="260" y1="244" x2="680" y2="244" stroke="#4a5a62" stroke-width="1"/>
<circle cx="330" cy="244" r="4" fill="#aebcc4"/>
<text x="330" y="234" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">GrantCredit(5_000m)</text>
<text x="680" y="232" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="248" y="292" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">second</text>
<line x1="260" y1="288" x2="560" y2="288" stroke="#4a5a62" stroke-width="1"/>
<circle cx="430" cy="288" r="4" fill="#aebcc4"/>
<text x="430" y="278" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">GrantCredit(8_000m)</text>
<text x="560" y="276" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M554 288L558.5 292.5L566 283.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M592 282L670 250" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M662 249.4L670 250L664.7 256" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M674 238L686 250M686 238L674 250" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="694" y="248" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
<path d="M680 256L680 324Q680 332 688 332L890 332" fill="none" stroke="#4a5a62" stroke-width="1"/>
<text x="668" y="336" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">retry</text>
<circle cx="782" cy="332" r="4" fill="#aebcc4"/>
<text x="782" y="322" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">GrantCredit(5_000m)</text>
<text x="890" y="320" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M884 332L888.5 336.5L896 327.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="928" y="356" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">The same code: GetOrNew finds the role of 8,000, and changes it</text>
</svg>
