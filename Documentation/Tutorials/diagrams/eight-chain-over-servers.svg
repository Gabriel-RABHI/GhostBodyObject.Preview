<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A chain is distributed whole; each server holds the Stores it needs</title>
<desc>The writer holds the whole chain ReadWrite, the Stores parcels, tracking and journal, distributed by writerEndPoint.Add(parcels), and runs Parcels.Register, Parcels.Scan and Parcels.Deliver. The site holds the Store of the tracking alone, ReadOnly, with its Repository alone, and reads the page Delivered and the board Lyon: 0. The notifications hold the Log alone, ReadOnly, followed from its start by a subscription, and give Your parcel is at Lyon and Your parcel is delivered. No other server holds the parcels.</desc>
<rect width="960" height="408" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A chain is distributed whole; each server holds the Stores it needs</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The cluster copies to each server the transactions of its Stores only</text>
<rect x="32" y="100" width="896" height="100" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The writer</text><text x="916" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">writerEndPoint.Add(parcels): the whole chain</text>
<rect x="48" y="136" width="254" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="175" y="159" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels</text><text x="175" y="175" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"parcels", ReadWrite</text>
<rect x="354" y="136" width="254" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="481" y="159" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">tracking</text><text x="481" y="175" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"tracking", ReadWrite</text>
<rect x="660" y="136" width="254" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="787" y="159" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">journal</text><text x="787" y="175" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"journal", ReadWrite</text>
<path d="M302 162L347 162" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M346.8 158.4L354 162L346.8 165.6Z" fill="#aebcc4"/>
<path d="M608 162L653 162" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M652.8 158.4L660 162L652.8 165.6Z" fill="#aebcc4"/>
<text x="175" y="230" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">no other server holds it</text>
<path d="M481 188L481 257" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M484.6 256.8L481 264L477.4 256.8Z" fill="#3987e5"/>
<text x="493" y="230" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">its transactions</text>
<path d="M787 188L787 257" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M790.6 256.8L787 264L783.4 256.8Z" fill="#3987e5"/>
<text x="799" y="230" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">its transactions</text>
<text x="32" y="284" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The writer runs</text>
<text x="32" y="312" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Parcels.Register("PX-7001", "Ada")</text>
<text x="32" y="334" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Parcels.Scan(ada, "Lyon")</text>
<text x="32" y="356" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Parcels.Deliver(ada)</text>
<rect x="340" y="264" width="282" height="122" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="352" y="284" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The site</text><text x="610" y="284" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">new TrackingRepository(siteTracking)</text>
<rect x="352" y="294" width="258" height="42" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="481" y="312" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">siteTracking</text><text x="481" y="328" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"tracking", ReadOnly</text>
<text x="352" y="354" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The page reads Delivered</text>
<text x="352" y="370" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The board reads Lyon: 0</text>
<rect x="646" y="264" width="282" height="122" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="658" y="284" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The notifications</text><text x="916" y="284" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">SubscribeFrom(0)</text>
<rect x="658" y="294" width="258" height="42" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="787" y="312" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">notifierJournal</text><text x="787" y="328" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">"journal", ReadOnly</text>
<text x="658" y="354" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Your parcel is at Lyon</text>
<text x="658" y="370" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Your parcel is delivered</text>
</svg>
