<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Two transactions take one email: the first commit wins</title>
<desc>Two concurrent transactions. The first creates Ada with hello@example.com; the second creates Bob with Hello@Example.com, the same email whatever its case. Neither sees the other: both Setters pass. The second commits. The commit of the first is refused by a TransactionConflictException of the kind Uniqueness, and nothing of it is written. Its retry creates Ada with the same email: the Setter refuses it at once, by a GhostUniquenessException. CustomerEmailIndex.Is("hello@example.com") finds Bob.</desc>
<rect width="960" height="352" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Two transactions take one email: the first commit wins</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Neither sees the other, so both Setters pass; the second commit is refused, and its retry meets the email at once</text>
<text x="32" y="138" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The first transaction</text>
<text x="32" y="156" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Ada</text>
<line x1="226" y1="140" x2="730" y2="140" stroke="#4a5a62" stroke-width="1"/>
<circle cx="340" cy="140" r="4" fill="#aebcc4"/>
<text x="340" y="128" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Email = "hello@example.com"</text>
<text x="730" y="128" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M724 134L736 146M736 134L724 146" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="744" y="144" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
<text x="802" y="144" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Uniqueness</text>
<text x="744" y="160" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">writes nothing</text>
<text x="32" y="202" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The second</text>
<text x="32" y="220" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Bob, the same email,</text>
<text x="32" y="236" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">whatever its case</text>
<line x1="226" y1="204" x2="600" y2="204" stroke="#4a5a62" stroke-width="1"/>
<circle cx="436" cy="204" r="4" fill="#aebcc4"/>
<text x="436" y="192" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Email = "Hello@Example.com"</text>
<text x="606" y="192" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M594 204L598.5 208.5L606 199.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="226" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">committed</text>
<path d="M612 200L720 147" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M712 147L720 147L715.1 153.3" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<text x="32" y="274" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The retry of the first</text>
<text x="32" y="292" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Ada: it sees the email taken</text>
<path d="M730 150L730 268Q730 276 738 276L813 276" fill="none" stroke="#4a5a62" stroke-width="1.2"/><path d="M812.8 272.4L820 276L812.8 279.6Z" fill="#4a5a62"/>
<text x="928" y="264" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Email = "hello@example.com"</text>
<path d="M824 270L836 282M836 270L824 282" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="844" y="280" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">refused</text>
<text x="928" y="298" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">GhostUniquenessException</text>
<text x="32" y="334" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">CustomerEmailIndex.Is("hello@example.com"): Bob</text>
</svg>
