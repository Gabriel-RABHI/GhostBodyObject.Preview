<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A lease that ended never writes</title>
<desc>A commit takes the lease on seat 1 for five minutes. The lease ends while the payment runs. Another till then writes the seat, and commits. The holder comes back and opens a transaction of its lease: its commit is refused, of the kind LeaseLost, and nothing is written. There are never two holders of one seat.</desc>
<rect width="960" height="300" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A lease that ended never writes</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The payment takes too long. Another till takes the seat, and the holder comes back</text>
<text x="146" y="138" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">the holder</text>
<line x1="158" y1="134" x2="262" y2="134" stroke="#4a5a62" stroke-width="1"/>
<circle cx="158" cy="134" r="4" fill="#aebcc4"/>
<text x="158" y="124" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<path d="M256 134L260.5 138.5L268 129.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">TryLock, Commit()</text>
<path d="M274 128H486Q490 128 490 132V136Q490 140 486 140H274Z" fill="#3987e5"/>
<text x="376" y="158" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">the lease, five minutes</text>
<line x1="490" y1="134" x2="742" y2="134" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/>
<text x="616" y="158" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">the payment goes on</text>
<path d="M736 128L748 140M748 128L736 140" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="742" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">OpenTransaction(lease)</text>
<text x="756" y="138" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">LeaseLost</text>
<text x="756" y="154" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">writes nothing</text>
<text x="578" y="218" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">another till</text>
<line x1="590" y1="214" x2="690" y2="214" stroke="#4a5a62" stroke-width="1"/>
<circle cx="590" cy="214" r="4" fill="#aebcc4"/>
<text x="590" y="204" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">opens</text>
<path d="M684 214L688.5 218.5L696 209.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="202" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="640" y="236" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Buyer = "Bob"</text>
<line x1="490" y1="144" x2="490" y2="252" stroke="#e4a93c" stroke-width="1"/>
<text x="490" y="270" font-size="12" font-weight="400" fill="#e4a93c" text-anchor="middle">the lease ends: the seat is free</text>
</svg>
