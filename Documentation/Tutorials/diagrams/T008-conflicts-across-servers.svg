<svg xmlns="http://www.w3.org/2000/svg" width="960" height="348" viewBox="0 0 960 348" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Two servers are two writers: the first commit wins</title>
<desc>Two scenarios of two servers, each on the last commit of its replica. The office changes the recipient of a parcel while the depot changes its depot and commits first: the commit of the office conflicts, of the kind Change; the commit of the depot is kept on both servers, the change of the office on none. Both give the number PX-6002 to a new parcel, for Ada at the office and for Bob at the depot: the commit of the office conflicts, of the kind Uniqueness, and one parcel of that number, Bob's, is on both servers.</desc>
<rect width="960" height="348" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Two servers are two writers: the first commit wins</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The office writes, then the depot writes and commits first: the commit of the office finds what changed</text>
<text x="32" y="122" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The same parcel</text>
<text x="32" y="142" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The commit of the depot is kept on</text>
<text x="32" y="158" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">both servers; the change of the</text>
<text x="32" y="174" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">office is on none</text>
<text x="310" y="140" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">The office</text>
<line x1="322" y1="136" x2="830" y2="136" stroke="#4a5a62" stroke-width="1"/>
<circle cx="420" cy="136" r="4" fill="#aebcc4"/>
<text x="420" y="126" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Recipient = "Ada Lovelace"</text>
<text x="830" y="124" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="310" y="188" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">The depot</text>
<line x1="322" y1="184" x2="700" y2="184" stroke="#4a5a62" stroke-width="1"/>
<circle cx="586" cy="184" r="4" fill="#aebcc4"/>
<text x="586" y="174" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Depot = "Lyon"</text>
<text x="700" y="172" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M694 184L698.5 188.5L706 179.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M712 180L820 142" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M812.1 141L820 142L814.4 147.7" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M824 130L836 142M836 130L824 142" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="844" y="140" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
<text x="844" y="156" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Change</text>
<line x1="32" y1="216" x2="928" y2="216" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="244" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The same unique value</text>
<text x="32" y="264" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">One parcel of that number, the</text>
<text x="32" y="280" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">one of the depot, on both</text>
<text x="32" y="296" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">servers</text>
<text x="310" y="262" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">The office</text>
<line x1="322" y1="258" x2="830" y2="258" stroke="#4a5a62" stroke-width="1"/>
<circle cx="420" cy="258" r="4" fill="#aebcc4"/>
<text x="420" y="248" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">PX-6002, Ada</text>
<text x="830" y="246" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="310" y="310" font-size="12" font-weight="400" fill="#7f9199" text-anchor="end">The depot</text>
<line x1="322" y1="306" x2="700" y2="306" stroke="#4a5a62" stroke-width="1"/>
<circle cx="586" cy="306" r="4" fill="#aebcc4"/>
<text x="586" y="296" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">PX-6002, Bob</text>
<text x="700" y="294" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<path d="M694 306L698.5 310.5L706 301.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M712 302L820 264" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M812.1 263L820 264L814.4 269.7" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M824 252L836 264M836 252L824 264" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="844" y="262" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">conflict</text>
<text x="844" y="278" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Uniqueness</text>
</svg>
