<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Chained to one Repository, two Logs write one commit, in the order of the Add</title>
<desc>Two columns. Without a Repository, parcels and routes commit by turns, Records alone, three commits: ParcelRegistered, RoutePlanned, ParcelScanned; the order is the one of their commits. Chained to one Repository, one transaction holds a Counter, then ParcelRegistered, RoutePlanned and ParcelScanned, added in that order across the Logs, in one commit. A reader sees registered, planned, scanned in both, over three transactions on the left, one on the right.</desc>
<rect width="960" height="450" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Chained to one Repository, two Logs write one commit, in the order of the Add</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The same order for the reader: by the commits on the left, by the Add on the right</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Without a Repository</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">two Logs commit by turns</text>
<line x1="32" y1="140" x2="466" y2="140" stroke="#2b3a42" stroke-width="1"/>
<text x="494" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Chained to one Repository</text>
<text x="494" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">repository.Chain(parcels), repository.Chain(routes)</text>
<line x1="494" y1="140" x2="928" y2="140" stroke="#2b3a42" stroke-width="1"/>
<text x="136" y="215" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">No entity: the Records alone</text>
<rect x="32" y="239" width="434" height="46" rx="8" fill="none" stroke="#4a5a62" stroke-width="1"/>
<text x="46" y="267" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels</text>
<rect x="136" y="242" width="222" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="247" y="259" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelRegistered</text><text x="247" y="275" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1201</text>
<text x="454" y="267" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<rect x="32" y="291" width="434" height="46" rx="8" fill="none" stroke="#4a5a62" stroke-width="1"/>
<text x="46" y="319" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">routes</text>
<rect x="136" y="294" width="222" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="247" y="311" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">RoutePlanned</text><text x="247" y="327" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1201</text>
<text x="454" y="319" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<rect x="32" y="343" width="434" height="46" rx="8" fill="none" stroke="#4a5a62" stroke-width="1"/>
<text x="46" y="371" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels</text>
<rect x="136" y="346" width="222" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="247" y="363" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="247" y="379" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1201</text>
<text x="454" y="371" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<rect x="494" y="154" width="434" height="238" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="506" y="174" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">One transaction</text><text x="916" y="174" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">the entities and the Records of both</text>
<text x="508" y="215" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">repository</text>
<rect x="598" y="190" width="222" height="40" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="709" y="207" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Counter</text><text x="709" y="223" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Lyon</text>
<text x="508" y="267" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels</text>
<rect x="598" y="242" width="222" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="709" y="259" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelRegistered</text><text x="709" y="275" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1203</text>
<text x="508" y="319" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">routes</text>
<rect x="598" y="294" width="222" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="709" y="311" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">RoutePlanned</text><text x="709" y="327" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1203</text>
<text x="508" y="371" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels</text>
<rect x="598" y="346" width="222" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="709" y="363" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="709" y="379" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1203</text>
<path d="M830 194L834 194Q838 194 838 198L838 378Q838 382 834 382L830 382" fill="none" stroke="#4a5a62" stroke-width="1.2"/>
<text x="916" y="292" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Commit()</text>
<text x="32" y="424" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">seen: registered, planned, scanned</text>
<text x="466" y="424" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">three commits</text>
<text x="494" y="424" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">seen: registered, planned, scanned</text>
<text x="928" y="424" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">one commit</text>
</svg>
