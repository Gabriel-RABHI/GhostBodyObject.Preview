<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>One replay of the Log gives both models again</title>
<desc>Three stages. After two commits the Store of the parcels holds PX-3002 and PX-3003, the Store of the tracking reads Lyon: 1, PX-3002: In transit at Lyon, 1 steps, and PX-3003: Delivered, 2 steps, and the Log on disk holds their Records. Opened again by new Chain(directory), both models are empty and IsBehindLog is true; the Log is whole. After the replay, committed by replay.Commit(last), the handlers have written both models again, the same lines, and IsBehindLog is false.</desc>
<rect width="960" height="462" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">One replay of the Log gives both models again</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The two models in memory, the Log on disk: closed, opened again, replayed</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="171" cy="94" r="3.5" fill="#aebcc4"/><circle cx="480" cy="94" r="3.5" fill="#aebcc4"/><circle cx="789" cy="94" r="3.5" fill="#aebcc4"/>
