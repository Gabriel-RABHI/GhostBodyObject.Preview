<svg xmlns="http://www.w3.org/2000/svg" width="960" height="324" viewBox="0 0 960 324" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Pessimistic watches a type, a claim watches an entity</title>
<desc>At the Pessimistic level, the transaction consulted the type of the ushers: a change of any usher, of the main hall or of the small hall, refuses its commit. With a claim, the transaction watches one entity, the main hall: the ushers of the small hall never concern it, and a change of an usher that does not claim the hall is not seen either, because it writes the usher and not the hall.</desc>
<rect width="960" height="324" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Pessimistic watches a type, a claim watches an entity</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">In blue, what refuses the commit if it changes. The decision reads the main hall</text>
<text x="32" y="112" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Pessimistic</text>
<text x="122" y="112" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">every usher of every hall</text>
<rect x="32" y="134" width="206" height="112" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="44" y="154" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Main hall</text>
<rect x="44" y="176" width="88" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="88" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Ada</text><text x="88" y="215" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">usher</text>
<rect x="138" y="176" width="88" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="182" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Bob</text><text x="182" y="215" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">usher</text>
<rect x="252" y="134" width="206" height="112" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="264" y="154" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Small hall</text>
<rect x="264" y="176" width="88" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="308" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Cleo</text><text x="308" y="215" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">usher</text>
<rect x="358" y="176" width="88" height="52" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="402" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Dan</text><text x="402" y="215" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">usher</text>
<text x="502" y="112" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">hall.Claim()</text>
<text x="606" y="112" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">the main hall, and nothing else</text>
<rect x="502" y="134" width="206" height="112" rx="10" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="514" y="154" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Main hall</text>
<rect x="514" y="176" width="88" height="52" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="558" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Ada</text><text x="558" y="215" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">usher</text>
<rect x="608" y="176" width="88" height="52" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="652" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Bob</text><text x="652" y="215" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">usher</text>
<rect x="722" y="134" width="206" height="112" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="734" y="154" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Small hall</text>
<rect x="734" y="176" width="88" height="52" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="778" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Cleo</text><text x="778" y="215" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">usher</text>
<rect x="828" y="176" width="88" height="52" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="872" y="199" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Dan</text><text x="872" y="215" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">usher</text>
<text x="32" y="278" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A claim sees what claims the hall too: two decisions that both claim it conflict, of the kind Claim.</text>
<text x="32" y="296" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">It does not see an usher changed without a claim: that change writes the usher, not the hall.</text>
</svg>
