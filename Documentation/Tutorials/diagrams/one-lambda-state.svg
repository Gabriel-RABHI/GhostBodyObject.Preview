<text x="221.6" y="348" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">each book</text>
<text x="646" y="304" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">2</text>
<text x="662" y="302" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">books before 1950</text>
<text x="32" y="374" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">Up to 4 values of state, in their order: BookCollection.Count(1950, 1970, static (book, from, to) =&gt; ...)</text>
