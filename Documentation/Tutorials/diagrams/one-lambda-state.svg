<text x="382.4" y="302" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">, </text>
<rect x="389.6" y="284" width="44.8" height="28" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="412" y="302.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">year</text>
<text x="517.2" y="302" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">) =&gt; book.Year &lt; year);</text>
