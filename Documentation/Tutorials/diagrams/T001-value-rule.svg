<text x="32" y="244" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">"SF-12"</text>
<path d="M400 240L633 240" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M632.8 236.4L640 240L632.8 243.6Z" fill="#3987e5"/>
<circle cx="470" cy="240" r="10" fill="#1a252b"/>
<path d="M464 240L468.5 244.5L476 235.5" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
