<text x="32" y="348" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Percent.From(150)</text>
<path d="M400 344L458 344" fill="none" stroke="#f07a78" stroke-width="1.6"/>
<circle cx="470" cy="344" r="10" fill="#1a252b"/>
<path d="M464 338L476 350M476 338L464 350" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="490" y="348" font-size="12" font-weight="400" fill="#f07a78" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ArgumentException</text>
<text x="32" y="376" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Money price = -0.01m</text>
<path d="M400 372L458 372" fill="none" stroke="#f07a78" stroke-width="1.6"/>
<circle cx="470" cy="372" r="10" fill="#1a252b"/>
<path d="M464 366L476 378M476 366L464 378" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="490" y="376" font-size="12" font-weight="400" fill="#f07a78" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ArgumentException</text>
<text x="32" y="404" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new ShelfMark("12")</text>
<path d="M400 400L458 400" fill="none" stroke="#f07a78" stroke-width="1.6"/>
<circle cx="470" cy="400" r="10" fill="#1a252b"/>
<path d="M464 394L476 406M476 394L464 406" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="490" y="404" font-size="12" font-weight="400" fill="#f07a78" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ArgumentException</text>
<text x="640" y="324" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">A value that breaks its rule does not exist:</text>
<text x="640" y="342" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">TryFrom says false, From and a conversion throw</text>
</svg>
