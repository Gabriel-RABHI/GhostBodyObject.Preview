<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>An address is a value: each assignment copies it</title>
<desc>Six instructions. before reads ada.Home: 1 rue de Rivoli, Paris 75001. home is a copy, by ToBody(). home.City and home.PostalCode change the copy: Lyon 69001; ada.Home and before do not change. ada.Home = home copies the values into the client: ada.Home is now in Lyon, and before stays in Paris. home.Street changes the copy again: ada.Home keeps 1 rue de Rivoli. ada.Billing = home copies the values of the copy into the billing address, none until then.</desc>
<rect width="960" height="462" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">An address is a value: each assignment copies it</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">One instruction per line: the blue address has just changed, and an arrow carries the values</text>
<text x="365" y="116" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">before</text>
