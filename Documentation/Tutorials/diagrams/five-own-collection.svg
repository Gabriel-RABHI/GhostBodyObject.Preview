<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The values fill the collection: no Add, nothing stored</title>
<desc>Two stages of the shop of the lesson. Orders 1, 3 and 4 have Ada for Customer, order 2 has Bob, and no order has Cid: ada.Orders.Count() is 3, and ada.LastOrder is order 4. After new Order { Number = 5, Customer = ada }, with no Add, ada.Orders.Count() is 4 and ada.LastOrder is order 5. The Customer of each order is a weak reference from the order to the customer, and the collection, a member over OrderCustomerIndex, is computed at each read.</desc>
<rect width="960" height="408" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The values fill the collection: no Add, nothing stored</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">customer.Orders is computed by an index at each read, from the Customer of each order</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="248" cy="94" r="3.5" fill="#aebcc4"/><circle cx="712" cy="94" r="3.5" fill="#aebcc4"/>
<text x="248" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">the shop of the lesson</text>
<text x="712" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new Order { Number = 5, Customer = ada }</text>
