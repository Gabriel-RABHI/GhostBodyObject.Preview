<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A query of a transaction sees every change at once</title>
<desc>Two rows of three moments. In Entity Framework, a DbContext collects two new books; a query on a DbSet asks the database, and does not find them; SaveChanges() sends them to the database. In GBO, two new books are in the transaction; BookCollection.Count() reads the transaction, and gives 2; transaction.Commit() writes them in the Store and closes the transaction.</desc>
<rect width="960" height="412" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A query of a transaction sees every change at once</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The same three moments: nothing to save first, because the query reads the memory you work in</text>
<text x="32" y="138" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Entity Framework</text>
<text x="32" y="158" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">A DbContext collects</text>
<text x="32" y="174" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">your changes</text>
<text x="200" y="100" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start">two new books</text>
<path d="M252 108L252 125" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M255.6 124.8L252 132L248.4 124.8Z" fill="#aebcc4"/>
<rect x="200" y="132" width="104" height="88" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="212" y="152" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">DbContext</text>
<rect x="208" y="162" width="88" height="22" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="252" y="177.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text>
<rect x="208" y="188" width="88" height="22" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="252" y="203.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Foundation</text>
<rect x="324" y="132" width="104" height="88" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="336" y="152" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Database</text>
<text x="376" y="190" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">no book</text>
<text x="574" y="100" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start">a query on a DbSet</text>
