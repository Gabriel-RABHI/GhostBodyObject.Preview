<rect x="832" y="188" width="88" height="22" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="876" y="203.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Foundation</text>
<line x1="32" y1="236" x2="928" y2="236" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="300" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">GBO</text>
<text x="32" y="320" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The transaction is the</text>
<text x="32" y="336" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">memory you work in</text>
<text x="200" y="262" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new Book { ... } × 2</text>
