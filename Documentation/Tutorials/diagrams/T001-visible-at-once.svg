<text x="376" y="352" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">no book</text>
<text x="450" y="262" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">BookCollection.Count() == 2</text>
