<rect x="458" y="162" width="88" height="22" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="502" y="177.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text>
<rect x="458" y="188" width="88" height="22" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="502" y="203.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">Foundation</text>
<rect x="574" y="132" width="104" height="88" rx="10" fill="none" stroke="#f07a78" stroke-width="1.5"/><text x="586" y="152" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Database</text>
<text x="626" y="182" font-size="12" font-weight="600" fill="#f07a78" text-anchor="middle">does not</text>
<text x="626" y="198" font-size="12" font-weight="600" fill="#f07a78" text-anchor="middle">find them</text>
<text x="700" y="100" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">SaveChanges()</text>
<rect x="700" y="132" width="104" height="88" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="712" y="152" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">DbContext</text>
