<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>After a failure, start again after the last transaction completed</title>
<desc>The Log holds three commits, a scan at Lyon, at Atlantis and at Paris. The tracker knows Lyon and Paris. The first run, Follow(log, 0, tracker), completes the transaction of Lyon: the depots hold Lyon, and the position moves to it. At Atlantis the handler throws a FormatException: the run ends there, and the position stays. The depot added to the known ones, the second run, Follow(log, tracker.Position + 1, tracker), starts at the transaction that failed and completes Atlantis, then Paris. The depots hold Lyon, Atlantis and Paris.</desc>
<rect width="960" height="410" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">After a failure, start again after the last transaction completed</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The position moves at the end of each transaction, never in the middle of one</text>
<text x="32" y="134" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The Log</text>
<text x="32" y="153" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Scan, three times</text>
<rect x="252" y="100" width="208" height="76" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="264" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">First commit</text>
<rect x="262" y="128" width="188" height="38" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="356" y="144" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="356" y="160" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Lyon</text>
<rect x="486" y="100" width="208" height="76" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="498" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Second commit</text>
<rect x="496" y="128" width="188" height="38" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="590" y="144" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="590" y="160" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Atlantis</text>
<rect x="720" y="100" width="208" height="76" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="732" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Third commit</text>
<rect x="730" y="128" width="188" height="38" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="824" y="144" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="824" y="160" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">Paris</text>
<text x="32" y="208" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The first run</text>
<text x="32" y="227" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The tracker knows Lyon and Paris</text>
<text x="32" y="244" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Follow(log, 0, tracker)</text>
<line x1="252" y1="214" x2="590" y2="214" stroke="#4a5a62" stroke-width="1"/>
<circle cx="356" cy="214" r="4.5" fill="#3987e5"/>
<text x="356" y="202" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Lyon</text>
<rect x="440" y="203" width="4" height="22" rx="2" fill="#3987e5"/>
<text x="590" y="198" font-size="12" font-weight="400" fill="#f07a78" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Atlantis</text>
<circle cx="590" cy="214" r="10" fill="#1a252b"/>
<path d="M584 208L596 220M596 208L584 220" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="590" y="242" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">FormatException</text>
<text x="720" y="218" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">Paris is not delivered</text>
<text x="720" y="242" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">tracker.Depots</text>
<text x="928" y="242" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">["Lyon"]</text>
<path d="M442 225L442 306Q442 314 450 314L479 314" fill="none" stroke="#3987e5" stroke-width="2"/><path d="M478.8 310.4L486 314L478.8 317.6Z" fill="#3987e5"/>
<text x="432" y="276" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Position + 1</text>
<text x="32" y="322" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The second run</text>
<text x="32" y="341" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">tracker.Known.Add("Atlantis")</text>
<text x="32" y="358" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Follow(log, tracker.Position + 1, tracker)</text>
<line x1="486" y1="314" x2="910" y2="314" stroke="#4a5a62" stroke-width="1"/>
<circle cx="590" cy="314" r="4.5" fill="#3987e5"/>
<text x="590" y="302" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Atlantis</text>
<rect x="674" y="303" width="4" height="22" rx="2" fill="#3987e5"/>
<circle cx="824" cy="314" r="4.5" fill="#3987e5"/>
<text x="824" y="302" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Paris</text>
<rect x="908" y="303" width="4" height="22" rx="2" fill="#3987e5"/>
<text x="486" y="358" font-size="12" font-weight="400" fill="#7f9199" text-anchor="start">tracker.Depots</text>
<text x="928" y="358" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">["Lyon", "Atlantis", "Paris"]</text>
<text x="32" y="392" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">A bar: the end of a transaction, where the position moves</text>
</svg>
