<svg xmlns="http://www.w3.org/2000/svg" width="960" height="422" viewBox="0 0 960 422" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>One Store, two transactions; a chain, only one</title>
<desc>Two panels. Two Repositories on one Store: parcelTransaction writes the parcel PX-0102 and boardTransaction writes the board of Lyon; parcelTransaction commits and boardTransaction rolls back; the Store holds the parcel and no board. Two Stores in a chain: one transaction writes the parcel PX-2001 and its page; it rolls back, and neither Store holds anything.</desc>
