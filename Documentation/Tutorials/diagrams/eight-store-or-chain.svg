<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">One Store, two transactions; a chain, only one</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two models written together, and a rollback: what each one keeps</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Two Repositories on one Store</text>
<text x="32" y="127" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new CarrierRepository(store), new TrackingRepository(store)</text>
