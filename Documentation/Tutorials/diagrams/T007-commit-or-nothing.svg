<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A commit appends its Records together, or nothing is appended</title>
<desc>Two transactions, each with a ParcelRegistered and a ParcelScanned, held by ParcelCollection in the order of their Add. transaction.Commit() appends both to the Log. transaction.Rollback() appends nothing, and the Log stays empty. Until the commit, the Log has none of them, and a transaction disposed without a commit is rolled back.</desc>
<rect width="960" height="356" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A commit appends its Records together, or nothing is appended</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The Records of a transaction, and what reaches the Log</text>
<text x="32" y="140" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Committed</text>
<text x="32" y="160" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Both Records, in</text>
<text x="32" y="176" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">the order of their Add</text>
<rect x="186" y="100" width="278" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="198" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The transaction</text><text x="452" y="120" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">ParcelCollection</text>
<rect x="198" y="132" width="121" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="258.5" y="153" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelRegistered</text><text x="258.5" y="169" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-1001, Ada</text>
<rect x="331" y="132" width="121" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="391.5" y="153" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="391.5" y="169" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-1001, Lyon</text>
<text x="557" y="146" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction.Commit()</text>
<path d="M464 156L643 156" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M642.8 152.4L650 156L642.8 159.6Z" fill="#aebcc4"/>
<rect x="650" y="100" width="278" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="662" y="120" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The Log</text>
<rect x="662" y="132" width="121" height="48" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="722.5" y="153" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelRegistered</text><text x="722.5" y="169" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1001, Ada</text>
<rect x="795" y="132" width="121" height="48" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="855.5" y="153" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="855.5" y="169" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">PX-1001, Lyon</text>
<line x1="32" y1="212" x2="928" y2="212" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="264" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Rolled back</text>
<text x="32" y="284" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">The Log has</text>
<text x="32" y="300" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">none of them</text>
<rect x="186" y="224" width="278" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1"/><text x="198" y="244" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The transaction</text><text x="452" y="244" font-size="11" font-weight="400" fill="#7f9199" text-anchor="end">ParcelCollection</text>
<rect x="198" y="256" width="121" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="258.5" y="277" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelRegistered</text><text x="258.5" y="293" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-1002, Bob</text>
<rect x="331" y="256" width="121" height="48" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="391.5" y="277" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">ParcelScanned</text><text x="391.5" y="293" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-1002, Lyon</text>
<text x="557" y="270" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction.Rollback()</text>
<path d="M464 280L606 280" fill="none" stroke="#7f9199" stroke-width="1.4" stroke-dasharray="5 4"/>
<rect x="650" y="224" width="278" height="92" rx="10" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="662" y="244" font-size="13" font-weight="600" fill="#7f9199" text-anchor="start">The Log</text>
<text x="789" y="284" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="middle">nothing</text>
<text x="32" y="338" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">Until the commit, the Log has none of them. A transaction disposed without a commit is rolled back.</text>
</svg>
