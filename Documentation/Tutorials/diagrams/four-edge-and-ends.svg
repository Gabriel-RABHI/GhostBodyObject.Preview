<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>An edge goes with either end, and its ends never go with it</title>
<desc>Two panels. On the left, Ada rated Dune 5 stars and Alien 1 star. rating.Remove() and ada.RatingEdges.Remove(alien) remove the two ratings: Ada, Dune and Alien stay, one critic and two movies. On the right, Ada rated Dune 5 stars and Alien 3 stars, Bob rated Dune 4 stars, and Ada saw Dune once. dune.Remove() removes Dune, its two ratings and its screening at that instruction: Ada, Bob and Alien stay, with the rating of Alien by Ada. Bob has no rating left, and no screening is left.</desc>
<rect width="960" height="424" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">An edge goes with either end, and its ends never go with it</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">What each removal takes stays drawn, dashed; what stays is in blue</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">An edge removed</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">rating.Remove(); ada.RatingEdges.Remove(alien);</text>
<line x1="32" y1="140" x2="464" y2="140" stroke="#2b3a42" stroke-width="1"/>
<rect x="32" y="164" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="74" y="188.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Ada</text>
<rect x="380" y="164" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="422" y="188.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Alien</text>
<rect x="380" y="284" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="422" y="308.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Dune</text>
<path d="M116 184L206 184" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M290 184L380 184" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="206" y="172" width="84" height="24" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="248" y="188.3" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">1 star</text>
<path d="M74 204L74 236Q74 244 82 244L206 244" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M290 244L414 244Q422 244 422 252L422 284" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="206" y="232" width="84" height="24" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="248" y="248.3" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">5 stars</text>
<text x="32" y="354" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Its ends stay</text>
<text x="32" y="378" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ada.RatingEdges.Count()</text>
<text x="464" y="378" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">0</text>
<text x="32" y="400" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">(CriticCollection.Count(), MovieCollection.Count())</text>
<text x="464" y="400" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">(1, 2)</text>
<text x="496" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">An end removed</text>
<text x="496" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">dune.Remove();</text>
<line x1="496" y1="140" x2="928" y2="140" stroke="#2b3a42" stroke-width="1"/>
<rect x="496" y="164" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="538" y="188.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Ada</text>
<rect x="496" y="284" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="538" y="308.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Bob</text>
<rect x="844" y="164" width="84" height="40" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="886" y="188.7" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Alien</text>
<rect x="844" y="284" width="84" height="40" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="886" y="308.7" font-size="13" font-weight="600" fill="#7f9199" text-anchor="middle">Dune</text>
<path d="M580 184L670 184" fill="none" stroke="#3987e5" stroke-width="1.4"/>
<path d="M754 184L844 184" fill="none" stroke="#3987e5" stroke-width="1.4"/>
<rect x="670" y="172" width="84" height="24" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="712" y="188.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">3 stars</text>
<path d="M556 204L556 216Q556 224 564 224L670 224" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M754 224L896 224Q904 224 904 232L904 284" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="670" y="212" width="84" height="24" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="712" y="228.3" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">5 stars</text>
<path d="M520 204L520 256Q520 264 528 264L670 264" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M754 264L860 264Q868 264 868 272L868 284" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="670" y="252" width="84" height="24" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="712" y="268.3" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">Screening</text>
<path d="M580 304L670 304" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<path d="M754 304L844 304" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="670" y="292" width="84" height="24" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="712" y="308.3" font-size="12" font-weight="600" fill="#7f9199" text-anchor="middle">4 stars</text>
<text x="496" y="354" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Its edges go at that instruction</text>
<text x="496" y="378" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">ScreeningCollection.Count()</text>
<text x="928" y="378" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">0</text>
<text x="496" y="400" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">bob.RatingEdges.Count()</text>
<text x="928" y="400" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="end">0</text>
</svg>
