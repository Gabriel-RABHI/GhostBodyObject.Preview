<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Is wants exactly its flags; Has, One, All and None look at each flag</title>
<desc>Five orders and their flags. Order 1 has no flag; order 2 has Gift; order 3 has Gift and Express; order 4 has Express and Fragile; order 5 has all three. Is(Gift | Express) finds order 3 only, of exactly these flags. Has(Gift) finds 2, 3 and 5. One(Gift | Express) finds 2, 3, 4 and 5. All(Gift | Express) finds 3 and 5. None(Fragile) finds 1, 2 and 3.</desc>
