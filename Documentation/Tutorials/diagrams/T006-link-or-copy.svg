<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A link shares one entity, an assignment copies a Record</title>
<desc>Two columns. On the left, Ada and Bob each hold a weak link, Favorite, to the one hotel Ritz: after ritz.Name = "The Ritz", both see The Ritz. On the right, Ada holds an address in Home, 12 rue de Rivoli, Paris, and Bob receives a copy of it by Home = ada.Home: after ada.Home takes a new address, 3 quai Saint-Antoine, Lyon, Bob still holds 12 rue de Rivoli, Paris: each one has its own.</desc>
<rect width="960" height="494" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A link shares one entity, an assignment copies a Record</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A second guest: the hotel stays one hotel, the address becomes two values</text>
<text x="32" y="108" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">An entity, by a link</text>
<text x="32" y="127" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[Weak] Option&lt;MHotel&gt; Favorite</text>
