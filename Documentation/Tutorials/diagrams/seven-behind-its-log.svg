<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>At each opening the model is behind its Log, until a replay</title>
<desc>Five steps. The first opening: four commits leave two parcels, PX-10001 InTransit Paris 2 and PX-10002 Delivered Lyon 1, and six Records in the Log. The second opening: the model is empty and behind its Log, IsBehindLog, and the Log holds its six Records. A transaction of the commands is refused meanwhile. Replay.Run brings the model to the same two parcels: it is ready. Parcels.Register goes on, in the model and in the Log: three parcels, seven Records.</desc>
<rect width="960" height="380" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">At each opening the model is behind its Log, until a replay</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">A model in memory, its Log on disk: what each one holds at each step</text>
