<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A Store condemned refuses the commit of the whole chain</title>
<desc>Two lines of time, one transaction per Store. In the transaction of the parcels, a new parcel PX-2002 of Bob. In the transaction of the tracking, a new board of Lyon, then Parcels--: the rule throws after the write, and CondemnedBy holds it. transaction.Commit(), called on the transaction of the parcels, is refused, the rule given as its inner exception. Neither Store holds anything.</desc>
<rect width="960" height="316" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A Store condemned refuses the commit of the whole chain</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The rule of the tracking throws after a write; the commit of the chain gives it as its cause</text>
<text x="32" y="132" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The parcels</text>
<text x="32" y="149" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction</text>
<text x="32" y="224" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">The tracking</text>
<text x="32" y="241" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">TrackingRepositoryTransaction.Current</text>
<line x1="296" y1="134" x2="796" y2="134" stroke="#4a5a62" stroke-width="1"/>
<circle cx="396" cy="134" r="4" fill="#aebcc4"/>
<text x="396" y="122" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new Parcel(...)</text>
<text x="396" y="154" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-2002, Bob</text>
<path d="M790 128L802 140M802 128L790 140" fill="none" stroke="#f07a78" stroke-width="2" stroke-linecap="round"/>
<text x="796" y="120" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction.Commit()</text>
<text x="810" y="138" font-size="12" font-weight="600" fill="#f07a78" text-anchor="start">Refused</text>
<text x="810" y="154" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">InnerException: the rule</text>
<line x1="296" y1="226" x2="566" y2="226" stroke="#4a5a62" stroke-width="1"/>
<line x1="566" y1="226" x2="764" y2="226" stroke="#f07a78" stroke-width="2"/>
<circle cx="396" cy="226" r="4" fill="#aebcc4"/>
<text x="396" y="214" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new DepotBoard { Depot = "Lyon" }</text>
<circle cx="566" cy="226" r="5" fill="#f07a78"/>
<text x="566" y="214" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">.Parcels--</text>
<text x="566" y="246" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">The rule throws after the write</text>
<text x="764" y="214" font-size="11" font-weight="400" fill="#f07a78" text-anchor="end" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">CondemnedBy: the rule</text>
<path d="M768 220L789 145" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M783.6 150.9L789 145L790.5 152.9" fill="none" stroke="#f07a78" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="32" y1="274" x2="928" y2="274" stroke="#2b3a42" stroke-width="1"/>
<text x="32" y="298" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Nothing in any Store: no parcel, no board</text>
</svg>
