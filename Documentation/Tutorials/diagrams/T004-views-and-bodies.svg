<rect x="824" y="154" width="88" height="44" rx="8" fill="none" stroke="#4a5a62" stroke-width="1" stroke-dasharray="4 4"/><text x="868" y="173" font-size="13" font-weight="600" fill="#7f9199" text-anchor="middle">0 stars</text><text x="868" y="189" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">removed</text>
<rect x="48" y="256" width="90" height="44" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="93" y="275" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Alien</text><text x="93" y="291" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">a View</text>
<path d="M138 278L653 278" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M652.8 274.4L660 278L652.8 281.6Z" fill="#aebcc4"/>
<text x="400" y="270" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="middle">A birth takes its other end by its View</text>
<rect x="660" y="256" width="96" height="44" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="708" y="275" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Cid</text><text x="708" y="291" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">a Body</text>
<path d="M756 278L817 278" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M816.8 274.4L824 278L816.8 281.6Z" fill="#aebcc4"/>
<rect x="824" y="256" width="88" height="44" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="868" y="275" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">4 stars</text><text x="868" y="291" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">new</text>
<text x="660" y="244" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">cid.NewRating(alien, 4)</text>
<text x="32" y="354" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">After the commit: Dune has 2 ratings, and Alien 8 stars</text>
</svg>
