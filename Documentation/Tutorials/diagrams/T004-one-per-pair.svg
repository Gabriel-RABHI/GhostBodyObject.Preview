<path d="M880 213L880 234" fill="none" stroke="#3987e5" stroke-width="1.4"/>
<rect x="847" y="189" width="66" height="24" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="880" y="205.3" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle">3 stars</text>
<text x="825" y="296" font-size="18" font-weight="600" fill="#e8eef1" text-anchor="middle">2</text>
<text x="825" y="316" font-size="12" font-weight="400" fill="#7f9199" text-anchor="middle">a new one</text>
<text x="32" y="348" font-size="11" font-weight="400" fill="#7f9199" text-anchor="start">Rate, the same instruction for the first time and the next ones:</text>
<text x="352" y="348" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">critic.RatingEdges.GetOrNew(movie).Stars = stars</text>
