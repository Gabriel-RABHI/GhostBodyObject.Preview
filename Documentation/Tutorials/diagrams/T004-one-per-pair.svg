<svg xmlns="http://www.w3.org/2000/svg" width="960" height="366" viewBox="0 0 960 366" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>One rating per pair: the second is refused, GetOrNew finds the first</title>
<desc>Four steps. ada.NewRating(dune, 4) makes a rating of 4 stars: 1 rating. ada.NewRating(dune, 2) is refused: the pair has its rating, nothing changes, and the count stays 1. Rate(ada, dune, 5) finds the rating of the pair and gives it 5 stars: still 1 rating. Rate(ada, alien, 3) finds no rating for this pair, and makes a new one of 3 stars: 2 ratings. Rate is critic.RatingEdges.GetOrNew(movie).Stars = stars.</desc>
<rect width="960" height="366" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">One rating per pair: the second is refused, GetOrNew finds the first</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The ratings, counted at each instruction</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="135" cy="94" r="3.5" fill="#aebcc4"/><circle cx="365" cy="94" r="3.5" fill="#aebcc4"/><circle cx="595" cy="94" r="3.5" fill="#aebcc4"/><circle cx="825" cy="94" r="3.5" fill="#aebcc4"/>
