<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 960 536" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>From the need to the index</title>
<desc>Does the question read a few entities of many? No: a query of the Views. Yes: is it about words in a text, or about values? Words: a text index, [TextIndex(n)] and [TextIndexed]. Values: a value index, [ValueIndex] and [ValueIndexComponent]. Then each yes adds its declaration. A long text written in steps: TextIndexing.Commit. Several values, in the order of a question: a composite index, several components. Conditions on any of them: indexes combined, And, Or, AndNot. A precision, a cycle: a rounded value or a part, DatePrecision, Decimals, Step, DatePart. One entity per value: a unique index, Unique = true. A collection of what the values decide: your own collection, a member over an index.</desc>
<rect width="960" height="536" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">From the need to the index</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Ask the questions in their order: the tool first, then what each yes adds to it</text>
<text x="32" y="104" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">Which tool?</text>
<rect x="32" y="116" width="248" height="56" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="156" y="139.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Does the question read</text><text x="156" y="156.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">a few entities of many?</text>
<rect x="344" y="116" width="248" height="56" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="468" y="139.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Is it about words in a text,</text><text x="468" y="156.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">or about values?</text>
<rect x="656" y="116" width="272" height="56" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="792" y="139.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A value index</text><text x="792" y="156.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[ValueIndex], [ValueIndexComponent]</text>
<path d="M280 144L337 144" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M336.8 140.4L344 144L336.8 147.6Z" fill="#aebcc4"/>
<text x="312" y="137" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<path d="M592 144L649 144" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M648.8 140.4L656 144L648.8 147.6Z" fill="#aebcc4"/>
<text x="624" y="137" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">values</text>
<rect x="32" y="200" width="248" height="56" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="156" y="223.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A query of the Views</text><text x="156" y="240.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">a report, a sum of every order</text>
<rect x="344" y="200" width="248" height="56" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="468" y="223.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A text index</text><text x="468" y="240.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">[TextIndex(n)], [TextIndexed]</text>
<path d="M156 172L156 193" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M159.6 192.8L156 200L152.4 192.8Z" fill="#aebcc4"/>
<text x="164" y="190" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">no</text>
<path d="M468 172L468 193" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M471.6 192.8L468 200L464.4 192.8Z" fill="#aebcc4"/>
<text x="476" y="190" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="start">words</text>
<text x="32" y="292" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="start">What does each yes add?</text>
<rect x="32" y="304" width="192" height="60" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="329.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">A long text written</text><text x="128" y="346.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">in steps?</text>
<path d="M224 334L245 334" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 330.4L252 334L244.8 337.6Z" fill="#aebcc4"/>
<text x="238" y="327" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="304" width="212" height="60" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="358" y="329.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Its words cut at the commit</text><text x="358" y="346.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">TextIndexing.Commit</text>
<rect x="32" y="376" width="192" height="60" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="401.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Several values, in the</text><text x="128" y="418.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">order of a question?</text>
<path d="M224 406L245 406" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 402.4L252 406L244.8 409.6Z" fill="#aebcc4"/>
<text x="238" y="399" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="376" width="212" height="60" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="358" y="401.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A composite index</text><text x="358" y="418.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">several components</text>
<rect x="32" y="448" width="192" height="60" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="128" y="473.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">Conditions on any</text><text x="128" y="490.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">of them?</text>
<path d="M224 478L245 478" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M244.8 474.4L252 478L244.8 481.6Z" fill="#aebcc4"/>
<text x="238" y="471" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="252" y="448" width="212" height="60" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="358" y="473.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Indexes combined</text><text x="358" y="490.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">And, Or, AndNot</text>
<rect x="496" y="304" width="192" height="60" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="592" y="338" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">A precision, a cycle?</text>
<path d="M688 334L709 334" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 330.4L716 334L708.8 337.6Z" fill="#aebcc4"/>
<text x="702" y="327" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="716" y="304" width="212" height="60" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="321" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A rounded value, a part</text><text x="822" y="338" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">DatePrecision, Decimals,</text><text x="822" y="355" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Step, DatePart</text>
<rect x="496" y="376" width="192" height="60" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="592" y="410" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">One entity per value?</text>
<path d="M688 406L709 406" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 402.4L716 406L708.8 409.6Z" fill="#aebcc4"/>
<text x="702" y="399" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="716" y="376" width="212" height="60" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="401.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">A unique index</text><text x="822" y="418.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">Unique = true</text>
<rect x="496" y="448" width="192" height="60" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="592" y="473.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">A collection of what</text><text x="592" y="490.5" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">the values decide?</text>
<path d="M688 478L709 478" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M708.8 474.4L716 478L708.8 481.6Z" fill="#aebcc4"/>
<text x="702" y="471" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">yes</text>
<rect x="716" y="448" width="212" height="60" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="822" y="473.5" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">Your own collection</text><text x="822" y="490.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">a member over an index</text>
</svg>
