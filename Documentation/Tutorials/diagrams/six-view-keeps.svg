<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The View of an entity follows it, the View of a Record keeps what it read</title>
<desc>Two stages. First, guest is the View of the guest Ada and before is the View of the Record in its Home: both read Paris. Then ada.Home takes a new address in Lyon, and ada.Name a much longer name. The View of the entity reads the guest as it is now: guest.Home.City is Lyon. The View of the Record is a value and keeps what it read: before.City is still Paris.</desc>
<rect width="960" height="356" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The View of an entity follows it, the View of a Record keeps what it read</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Two Views taken of Ada, and what each one reads after a change of the guest</text>
<line x1="32" y1="94" x2="928" y2="94" stroke="#4a5a62" stroke-width="1"/><circle cx="246" cy="94" r="3.5" fill="#aebcc4"/><circle cx="714" cy="94" r="3.5" fill="#aebcc4"/>
<text x="246" y="118" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">var guest = ada.ToView();</text>
<text x="246" y="134" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">var before = ada.Home;</text>
