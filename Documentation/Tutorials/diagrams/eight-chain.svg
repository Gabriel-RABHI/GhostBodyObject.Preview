<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>A chain opens both transactions, and commits both Stores</title>
<desc>From top to bottom. parcels.AddChildStore(tracking) chains the Store of the tracking after the Store of the parcels, before their first transaction. carrier.Chain(site) chains their Repositories in the same order. The transaction opened by carrier.OpenTransaction opens TrackingRepositoryTransaction.Current, ambient, in the same mode. The code writes the parcel PX-1001 of Ada and its page, Registered, whose identity TrackingPageRef.Of(parcel) derives from the parcel. transaction.Commit() writes both Stores.</desc>
<rect width="960" height="432" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">A chain opens both transactions, and commits both Stores</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The instructions of the test, from top to bottom, in the model of the parcels and in the model of the tracking</text>
<text x="167" y="106" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">The parcels</text>
<text x="783" y="106" font-size="13" font-weight="600" fill="#e8eef1" text-anchor="middle">The tracking</text>
<rect x="32" y="116" width="270" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="167" y="136" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels</text><text x="167" y="152" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">a Store</text>
<rect x="638" y="116" width="290" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="783" y="136" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">tracking</text><text x="783" y="152" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">a Store</text>
<path d="M302 139L631 139" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M630.8 135.4L638 139L630.8 142.6Z" fill="#aebcc4"/>
<text x="470" y="131" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">parcels.AddChildStore(tracking)</text>
<text x="470" y="156" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">before their first transaction</text>
<rect x="32" y="178" width="270" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="167" y="198" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">carrier</text><text x="167" y="214" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">new CarrierRepository(parcels)</text>
<rect x="638" y="178" width="290" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="783" y="198" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">site</text><text x="783" y="214" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">new TrackingRepository(tracking)</text>
<path d="M302 201L631 201" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M630.8 197.4L638 201L630.8 204.6Z" fill="#aebcc4"/>
<text x="470" y="193" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">carrier.Chain(site)</text>
<text x="470" y="218" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">in the same order</text>
<rect x="32" y="240" width="270" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="167" y="260" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction</text><text x="167" y="276" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">carrier.OpenTransaction(ReadWrite)</text>
<rect x="638" y="240" width="290" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="783" y="260" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">TrackingRepositoryTransaction.Current</text><text x="783" y="276" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">ReadWrite, as the first one</text>
<path d="M302 263L631 263" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M630.8 259.4L638 263L630.8 266.6Z" fill="#aebcc4"/>
<text x="470" y="255" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle">opens the second one</text>
<text x="470" y="280" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">ambient, in the same mode</text>
<rect x="32" y="302" width="270" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="167" y="322" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new Parcel(ParcelRef.New())</text><text x="167" y="338" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-1001, Ada</text>
<rect x="638" y="302" width="290" height="46" rx="8" fill="#233139" stroke="#4a5a62" stroke-width="1"/><text x="783" y="322" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">new TrackingPage(...)</text><text x="783" y="338" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">PX-1001, Ada, Registered</text>
<path d="M302 325L631 325" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M630.8 321.4L638 325L630.8 328.6Z" fill="#aebcc4"/>
<text x="470" y="317" font-size="12" font-weight="400" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">TrackingPageRef.Of(parcel)</text>
<text x="470" y="342" font-size="11" font-weight="400" fill="#7f9199" text-anchor="middle">the same parcel gives the same page</text>
<path d="M167 348L167 357" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M170.6 356.8L167 364L163.4 356.8Z" fill="#aebcc4"/>
<path d="M783 348L783 357" fill="none" stroke="#aebcc4" stroke-width="1.6"/><path d="M786.6 356.8L783 364L779.4 356.8Z" fill="#aebcc4"/>
<rect x="32" y="364" width="896" height="46" rx="8" fill="#1f3a55" stroke="#3987e5" stroke-width="1.5"/><text x="480" y="382.5" font-size="12" font-weight="600" fill="#e8eef1" text-anchor="middle" font-family="'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace">transaction.Commit()</text><text x="480" y="399.5" font-size="11" font-weight="400" fill="#aebcc4" text-anchor="middle">One commit: it writes both Stores</text>
</svg>
