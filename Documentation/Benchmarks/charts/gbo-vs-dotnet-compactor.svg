<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>The compactor puts the entities back in order</title>
<desc>Before, the index points to Ghosts in the order 3, 1, 4, 2, apart from each other. The compactor copies them; after, the same Ghosts are side by side in the order 1, 2, 3, 4. Readers are not blocked, and the emptied Segments are released.</desc>
<rect width="960" height="442" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">The compactor puts the entities back in order</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">The order of a collection becomes the order of the memory again: a scan reads straight ahead.</text>
<text x="32" y="100" font-size="14" font-weight="600" fill="#e8eef1" text-anchor="start">Before</text>
