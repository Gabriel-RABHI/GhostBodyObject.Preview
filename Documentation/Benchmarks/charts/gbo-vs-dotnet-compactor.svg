<text x="32" y="400" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">It copies the current version of each entity to the head of the Store, in the order of the identifiers, about 64 KB at a time, then releases the Segments it emptied.</text>
<text x="32" y="420" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="start">Readers are not blocked: a copy is the same version, and each transaction keeps reading what it saw. It runs in the background, or on demand: 4.5 GB moved in 6.7 s.</text>
