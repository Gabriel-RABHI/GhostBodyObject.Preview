<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title>Random reads overlap</title>
<desc>With one read at a time, 6.1 M/s, as a linked list at 6.1 M/s. The throughput rises with the reads allowed at once, up to 32.1 M/s without limit.</desc>
