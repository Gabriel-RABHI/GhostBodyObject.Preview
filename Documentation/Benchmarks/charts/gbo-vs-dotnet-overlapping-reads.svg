<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">Random reads overlap</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">10,000,000 objects of .NET read at random: the same objects, the same order, the reads that may run at once</text>
<line x1="282" y1="96" x2="282" y2="366" stroke="#4a5a62" stroke-width="1"/>
<text x="266" y="115" font-size="13" font-weight="400" fill="#e8eef1" text-anchor="end">Linked list</text>
