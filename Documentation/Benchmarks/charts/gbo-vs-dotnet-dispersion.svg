<title>After the swaps, nothing is in order</title>
<desc>Above, the memory of .NET: the List points to its objects in another order, and one record points to three strings far apart among the others. Below, the memory of GBO: the index points to Ghosts in another order, each one holding its strings side by side.</desc>
<rect width="960" height="424" rx="14" fill="#1a252b"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#e8eef1" text-anchor="start">After the swaps, nothing is in order</text>
<text x="32" y="68" font-size="13" font-weight="400" fill="#aebcc4" text-anchor="start">Each side went through the same dispersion. An object of .NET lost its strings; a Ghost took them with it.</text>
<text x="32" y="104" font-size="14" font-weight="600" fill="#e8eef1" text-anchor="start">.NET</text>
<text x="928" y="104" font-size="12" font-weight="400" fill="#aebcc4" text-anchor="end">one record to read: its object, then one jump per string, each address read from the jump before</text>
