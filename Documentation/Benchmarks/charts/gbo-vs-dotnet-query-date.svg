<desc>As created: GBO 39.1 M/s, .NET 92.9 M/s. Dispersed: GBO 21.2 M/s, .NET 32.3 M/s. GBO aligned by the compactor 61.6 M/s, .NET still dispersed 32.3 M/s.</desc>
